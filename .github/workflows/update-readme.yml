name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project structure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path("README.md")

          # =========================================================
          # Configuration
          # =========================================================

          project_descriptions = {
              # Power BI
              "analyse-coupe-du-monde-fifa-2026":
                  "Analyse et visualisation de la Coupe du Monde FIFA 2026 avec Power BI",

              "analyse-performance-football-europe":
                  "Analyse de la performance du football européen avec Power BI",

              "analyse-performance-olist":
                  "Analyse de performance e-commerce avec Power BI",

              "analyse-pitchside-pro-revenue":
                  "Analyse des revenus et de la performance commerciale avec Power BI",

              "analyse-retail-star-schema":
                  "Analyse retail avec modèle en étoile et Power BI",

              "assurance-automobile-dashboard":
                  "Analyse et pilotage de la performance d'un portefeuille automobile",

              "gap-service":
                  "Analyse et pilotage de la performance du service",

              "pilotage-reseau-distribution-multimagasins":
                  "Pilotage décisionnel d'un réseau de distribution multi-magasins avec Power BI",

              "pilotage-risque-credit-bancaire":
                  "Analyse et pilotage du risque de crédit bancaire",

              # Machine Learning
              "01_Prediction_progression_diabete":
                  "Prédiction de la progression du diabète",

              "02_Prediction_bruit_aerodynamique":
                  "Prédiction du bruit aérodynamique",

              "03_PhysioPredict":
                  "Projet de prédiction appliquée aux données physiologiques",

              "01_Customer_Churn":
                  "Prédiction du churn client",
          }

          # Dossiers techniques qui ne sont jamais considérés
          # comme des projets.
          ignored_dirs = {
              "data",
              "documentation",
              "screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "Data",
              "Documentation",
              "_template",
          }

          def is_real_project(path):
              """
              Un projet est un dossier contenant directement
              un README.md et n'étant pas un dossier technique.
              """
              return (
                  path.is_dir()
                  and path.name not in ignored_dirs
                  and not path.name.startswith(".")
                  and (path / "README.md").is_file()
              )

          def project_link(path):
              return (
                  f"[Voir le projet]"
                  f"(./{path.as_posix()}/README.md)"
              )

          lines = [
              "## Projets",
              "",
              "La liste des projets est générée automatiquement à partir "
              "des projets présents dans le dépôt.",
              "",
              "<!-- AUTO_STRUCTURE_START -->",
              "",
          ]

          # =========================================================
          # MACHINE LEARNING
          # =========================================================

          ml_root = Path("Machine-Learning")

          if ml_root.is_dir():

              lines.extend([
                  "### 🧠 Machine Learning",
                  "",
                  "Projets de classification, prédiction et Machine Learning.",
                  "",
              ])

              ml_projects = []

              # Les projets ML peuvent être imbriqués dans plusieurs
              # niveaux de catégories.
              for readme in ml_root.rglob("README.md"):

                  project = readme.parent

                  if project == ml_root:
                      continue

                  if any(
                      part in ignored_dirs
                      for part in project.parts
                  ):
                      continue

                  # Exclure les dossiers de catégories.
                  if project.name in {
                      "I_Apprentissage_supervise",
                      "A_Regression",
                      "B_Classification",
                  }:
                      continue

                  if is_real_project(project):
                      ml_projects.append(project)

              # Suppression des doublons
              ml_projects = sorted(
                  set(ml_projects),
                  key=lambda p: p.as_posix().lower()
              )

              for project in ml_projects:

                  description = project_descriptions.get(
                      project.name,
                      "Projet Machine Learning"
                  )

                  lines.append(
                      f"- **{description}** — {project_link(project)}"
                  )

              lines.append("")

          # =========================================================
          # POWER BI
          # =========================================================

          powerbi_root = Path("PowerBI")

          if powerbi_root.is_dir():

              lines.extend([
                  "### 📊 Power BI",
                  "",
                  "Projets de Business Intelligence, analyse de données, "
                  "modélisation, DAX et dashboards.",
                  "",
              ])

              powerbi_projects = []

              # Les projets Power BI sont directement dans PowerBI/.
              for project in powerbi_root.iterdir():

                  if is_real_project(project):
                      powerbi_projects.append(project)

              powerbi_projects = sorted(
                  powerbi_projects,
                  key=lambda p: p.name.lower()
              )

              for project in powerbi_projects:

                  description = project_descriptions.get(
                      project.name,
                      "Projet du portfolio Power BI"
                  )

                  lines.append(
                      f"- **{description}** — {project_link(project)}"
                  )

              lines.append("")

          lines.append("<!-- AUTO_STRUCTURE_END -->")

          # =========================================================
          # Mise à jour du README
          # =========================================================

          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO_STRUCTURE_START -->"
          end = "<!-- AUTO_STRUCTURE_END -->"

          if start not in content or end not in content:
              raise ValueError(
                  "Les balises AUTO_STRUCTURE_START et "
                  "AUTO_STRUCTURE_END sont absentes du README.md."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          section_start = content.rfind(
              "## Structure du dépôt",
              0,
              start_index
          )

          if section_start == -1:

              section_start = content.rfind(
                  "## Projets",
                  0,
                  start_index
              )

          if section_start == -1:
              raise ValueError(
                  "Impossible de trouver le début de la section "
                  "automatique du README."
              )

          new_section = "\n".join(lines)

          content = (
              content[:section_start]
              + new_section
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8",
              newline="\n"
          )

          print("README.md mis à jour avec succès.")
          PY

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README."
          else
            git commit -m "chore: update README structure"
            git push
          fi
