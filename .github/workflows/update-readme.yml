name: Update Portfolio Projects

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "Excel/**"
      - "Python/**"
      - "sql/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-projects
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate README and Hugo projects page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          REPO_URL = "https://github.com/fbomisso/fabrice.bomisso"

          README_PATH = Path("README.md")
          HUGO_PATH = Path("content/projets/_index.md")

          # ================================================================
          # CONFIGURATION
          # ================================================================

          ROOTS = {
              "Machine Learning": Path("Machine-Learning"),
              "Power BI": Path("PowerBI"),
              "Excel": Path("Excel"),
              "Python": Path("Python"),
              "SQL": Path("sql"),
          }

          IGNORED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
              "env",
              ".env",
              "data",
              "Data",
              "raw",
              "documentation",
              "Documentation",
              "docs",
              "Docs",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "model",
              "app",
              "Visuels_Projet",
              "_template",
          }

          # ================================================================
          # PROJETS MIS EN AVANT SUR LA PAGE HUGO
          #
          # IMPORTANT :
          # Cette liste est volontairement indépendante de la détection
          # automatique du README.
          #
          # La page Hugo n'affichera QUE ces projets.
          # ================================================================

          FEATURED_PROJECTS = [
              {
                  "path": "Machine-Learning/I_Apprentissage_supervise/"
                         "A_Regression/01_Prediction_progression_diabete",
                  "category": "Machine Learning",
                  "title": "Progression de la prédiction du diabète",
                  "type": "Machine Learning · Régression",
                  "description":
                      "Projet de régression visant à prédire la progression "
                      "du diabète à partir de variables cliniques.",
              },
              {
                  "path": "Machine-Learning/I_Apprentissage_supervise/"
                         "A_Regression/02_Prediction_bruit_aerodynamique",
                  "category": "Machine Learning",
                  "title": "Prédiction du bruit aérodynamique",
                  "type": "Machine Learning · Régression",
                  "description":
                      "Projet de régression consacré à la prédiction du "
                      "bruit aérodynamique.",
              },
              {
                  "path": "Machine-Learning/I_Apprentissage_supervise/"
                         "B_Classification/01_Customer_Churn",
                  "category": "Machine Learning",
                  "title": "Churn client",
                  "type": "Machine Learning · Classification",
                  "description":
                      "Prédiction du churn client avec Random Forest, "
                      "analyse SHAP, segmentation des risques et "
                      "application Streamlit.",
              },
              {
                  "path": "PowerBI/analyse-coupe-du-monde-fifa-2026",
                  "category": "Power BI",
                  "title": "Analyse de la Coupe du Monde FIFA 2026",
                  "type": "Power BI",
                  "description":
                      "Analyse et visualisation de la Coupe du Monde "
                      "FIFA 2026 avec Power BI.",
              },
              {
                  "path": "PowerBI/analyse-performance-football-europe",
                  "category": "Power BI",
                  "title": "Analyse de la performance du football européen",
                  "type": "Power BI",
                  "description":
                      "Analyse de la performance du football européen "
                      "avec Power BI.",
              },
          ]

          # ================================================================
          # OUTILS
          # ================================================================

          def is_hidden(path):
              return any(part.startswith(".") for part in path.parts)

          def is_ignored(path):
              return any(part in IGNORED_DIRS for part in path.parts)

          def has_readme(path):
              return (path / "README.md").is_file()

          def clean_name(name):
              name = name.replace("_", " ")
              name = name.replace("-", " ")
              name = re.sub(r"\s+", " ", name)
              return name.strip()

          def github_url(path):
              return (
                  f"{REPO_URL}/tree/main/"
                  f"{path.as_posix()}"
              )

          def has_readme_child(path):
              try:
                  for child in path.iterdir():
                      if not child.is_dir():
                          continue

                      if is_hidden(child) or is_ignored(child):
                          continue

                      if has_readme(child):
                          return True

              except OSError:
                  return False

              return False

          # ================================================================
          # DETECTION MACHINE LEARNING
          #
          # Les dossiers organisationnels ne sont PAS considérés comme
          # des projets.
          #
          # Exemple :
          #
          # I_Apprentissage_supervise/
          # ├── README.md
          # ├── A_Regression/
          # │   ├── README.md
          # │   ├── 01_Projet/
          # │   │   └── README.md
          # │   └── 02_Projet/
          # │       └── README.md
          #
          # Seuls 01_Projet et 02_Projet sont détectés comme projets.
          # ================================================================

          def is_real_ml_project(path):
              return (
                  path.is_dir()
                  and not is_hidden(path)
                  and not is_ignored(path)
                  and has_readme(path)
                  and not has_readme_child(path)
              )

          ml_projects = []

          ml_root = ROOTS["Machine Learning"]

          if ml_root.is_dir():
              for path in ml_root.rglob("*"):
                  if is_real_ml_project(path):
                      ml_projects.append(path)

          ml_projects = sorted(
              set(ml_projects),
              key=lambda p: p.as_posix().lower()
          )

          # ================================================================
          # DETECTION CATEGORIES DIRECTES
          #
          # PowerBI/
          # Excel/
          # Python/
          # sql/
          #
          # Un projet = dossier contenant README.md.
          # ================================================================

          def detect_direct_projects(root):
              projects = []

              if not root.is_dir():
                  return projects

              for path in root.iterdir():
                  if (
                      path.is_dir()
                      and not is_hidden(path)
                      and not is_ignored(path)
                      and has_readme(path)
                  ):
                      projects.append(path)

              return sorted(
                  set(projects),
                  key=lambda p: p.name.lower()
              )

          powerbi_projects = detect_direct_projects(
              ROOTS["Power BI"]
          )

          excel_projects = detect_direct_projects(
              ROOTS["Excel"]
          )

          python_projects = detect_direct_projects(
              ROOTS["Python"]
          )

          sql_projects = detect_direct_projects(
              ROOTS["SQL"]
          )

          projects_by_category = {
              "Machine Learning": ml_projects,
              "Power BI": powerbi_projects,
              "Excel": excel_projects,
              "Python": python_projects,
              "SQL": sql_projects,
          }

          # ================================================================
          # HIERARCHIE MACHINE LEARNING
          # ================================================================

          def relative_ml_parts(path):
              parts = path.relative_to(
                  ROOTS["Machine Learning"]
              ).parts

              return parts

          def category_label(part):
              return clean_name(
                  re.sub(r"^[IVX]+_", "", part)
              )

          def subgroup_label(part):
              return clean_name(
                  re.sub(r"^[A-Z]_", "", part)
              )

          def project_number(projects, index):
              return f"{index:02d}"

          # ================================================================
          # LOGS
          # ================================================================

          print()
          print("=" * 70)
          print("PROJETS DETECTES")
          print("=" * 70)

          for category, projects in projects_by_category.items():
              print()
              print(
                  f"{category}: {len(projects)} projet(s)"
              )

              for project in projects:
                  print(
                      f"  - {project.as_posix()}"
                  )

          print()
          print("=" * 70)

          # ================================================================
          # README
          #
          # Le README contient TOUS les projets.
          # ================================================================

          START = "<!-- AUTO_STRUCTURE_START -->"
          END = "<!-- AUTO_STRUCTURE_END -->"

          readme_content = README_PATH.read_text(
              encoding="utf-8"
          )

          if START not in readme_content:
              raise ValueError(
                  "AUTO_STRUCTURE_START absent de README.md"
              )

          if END not in readme_content:
              raise ValueError(
                  "AUTO_STRUCTURE_END absent de README.md"
              )

          readme_lines = [
              START,
              "",
          ]

          # ------------------------------------------------
          # MACHINE LEARNING
          # ------------------------------------------------

          if ml_projects:

              readme_lines.extend([
                  "### 🤖 Apprentissage automatique",
                  "",
              ])

              # Regroupement par niveau :
              # I / II / III / IV
              ml_tree = {}

              for project in ml_projects:
                  parts = relative_ml_parts(project)

                  if len(parts) < 2:
                      continue

                  level = parts[0]
                  subgroup = parts[1] if len(parts) >= 3 else None

                  ml_tree.setdefault(
                      level,
                      {}
                  ).setdefault(
                      subgroup,
                      []
                  ).append(project)

              for level in sorted(
                  ml_tree,
                  key=lambda x: x.lower()
              ):

                  level_path = (
                      ROOTS["Machine Learning"] / level
                  )

                  level_url = github_url(level_path)

                  readme_lines.extend([
                      f"#### [{category_label(level)}]"
                      f"({level_url})",
                      "",
                  ])

                  subgroups = ml_tree[level]

                  for subgroup in sorted(
                      subgroups,
                      key=lambda x: str(x).lower()
                  ):

                      if subgroup is None:
                          continue

                      subgroup_path = (
                          level_path / subgroup
                      )

                      subgroup_url = github_url(
                          subgroup_path
                      )

                      readme_lines.extend([
                          f"##### [{subgroup_label(subgroup)}]"
                          f"({subgroup_url})",
                          "",
                      ])

                      projects = sorted(
                          subgroups[subgroup],
                          key=lambda p: p.name.lower()
                      )

                      for index, project in enumerate(
                          projects,
                          start=1
                      ):

                          name = clean_name(
                              re.sub(
                                  r"^\d+_",
                                  "",
                                  project.name
                              )
                          )

                          readme_lines.append(
                              f"- [{index:02d} {name}]"
                              f"({github_url(project)})"
                          )

                      readme_lines.append("")

          # ------------------------------------------------
          # AUTRES CATEGORIES
          #
          # Numérotation indépendante :
          #
          # Power BI : 01, 02, 03...
          # Excel    : 01, 02, 03...
          # Python   : 01, 02, 03...
          # SQL      : 01, 02, 03...
          # ------------------------------------------------

          category_titles = {
              "Power BI": "### 📊 Power BI",
              "Excel": "### 📗 Excel",
              "Python": "### 🐍 Python",
              "SQL": "### 🗄️ SQL",
          }

          for category in [
              "Power BI",
              "Excel",
              "Python",
              "SQL",
          ]:

              projects = projects_by_category[category]

              if not projects:
                  continue

              readme_lines.extend([
                  category_titles[category],
                  "",
              ])

              for index, project in enumerate(
                  projects,
                  start=1
              ):

                  name = clean_name(
                      re.sub(
                          r"^\d+_",
                          "",
                          project.name
                      )
                  )

                  readme_lines.append(
                      f"- [{index:02d} {name}]"
                      f"({github_url(project)})"
                  )

              readme_lines.append("")

          readme_lines.append(END)

          generated_readme = "\n".join(
              readme_lines
          )

          start_index = readme_content.index(START)

          end_index = (
              readme_content.index(END)
              + len(END)
          )

          new_readme = (
              readme_content[:start_index]
              + generated_readme
              + readme_content[end_index:]
          )

          README_PATH.write_text(
              new_readme,
              encoding="utf-8",
              newline="\n"
          )

          # ================================================================
          # HUGO
          #
          # UNIQUEMENT LES 5 PROJETS VITRINES.
          # ================================================================

          hugo_lines = [
              "---",
              'title: "Projets"',
              "---",
              "",
              "Une sélection de projets réalisés en "
              "Business Intelligence, Data Analytics "
              "et Data Science.",
              "",
          ]

          # ------------------------------------------------
          # Vérification des projets vitrines
          # ------------------------------------------------

          featured_existing = []

          for featured in FEATURED_PROJECTS:

              path = Path(featured["path"])

              if not path.is_dir():
                  print(
                      f"AVERTISSEMENT : projet vitrine "
                      f"absent : {path}"
                  )
                  continue

              if not has_readme(path):
                  print(
                      f"AVERTISSEMENT : README absent : "
                      f"{path}"
                  )
                  continue

              featured_existing.append(featured)

          # ------------------------------------------------
          # MACHINE LEARNING
          # ------------------------------------------------

          featured_ml = [
              p for p in featured_existing
              if p["category"] == "Machine Learning"
          ]

          if featured_ml:

              hugo_lines.extend([
                  "## 🤖 Machine Learning",
                  "",
              ])

              # -----------------------------
              # I Apprentissage supervise
              # -----------------------------

              hugo_lines.extend([
                  "### [I Apprentissage supervise]"
                  f"({github_url(Path("
                  "'Machine-Learning/"
                  "I_Apprentissage_supervise'"
                  "))})",
                  "",
              ])

              featured_regression = [
                  p for p in featured_ml
                  if "/A_Regression/" in p["path"]
              ]

              if featured_regression:

                  hugo_lines.extend([
                      "#### [A Regression]"
                      f"({github_url(Path("
                      "'Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression'"
                      "))})",
                      "",
                  ])

                  for featured in featured_regression:

                      hugo_lines.extend([
                          f"**{featured['title']}**",
                          "",
                          featured["description"],
                          "",
                          f"[Voir le projet]"
                          f"({github_url(Path(featured['path']))})",
                          "",
                      ])

              featured_classification = [
                  p for p in featured_ml
                  if "/B_Classification/" in p["path"]
              ]

              if featured_classification:

                  hugo_lines.extend([
                      "#### [B Classification]"
                      f"({github_url(Path("
                      "'Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "B_Classification'"
                      "))})",
                      "",
                  ])

                  for featured in featured_classification:

                      hugo_lines.extend([
                          f"**{featured['title']}**",
                          "",
                          featured["description"],
                          "",
                          f"[Voir le projet]"
                          f"({github_url(Path(featured['path']))})",
                          "",
                      ])

          # ------------------------------------------------
          # POWER BI
          # ------------------------------------------------

          featured_powerbi = [
              p for p in featured_existing
              if p["category"] == "Power BI"
          ]

          if featured_powerbi:

              hugo_lines.extend([
                  "## 📊 Power BI",
                  "",
              ])

              for index, featured in enumerate(
                  featured_powerbi,
                  start=1
              ):

                  hugo_lines.extend([
                      f"### {index:02d} "
                      f"{featured['title']}",
                      "",
                      f"**{featured['type']}**",
                      "",
                      featured["description"],
                      "",
                      f"[Voir le projet]"
                      f"({github_url(Path(featured['path']))})",
                      "",
                  ])

          # ------------------------------------------------
          # MESSAGE SI AUCUN PROJET VITRINE
          # ------------------------------------------------

          if not featured_existing:

              hugo_lines.extend([
                  "_Aucun projet vitrine disponible pour le moment._",
                  "",
              ])

          # ------------------------------------------------
          # FIN
          # ------------------------------------------------

          HUGO_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          HUGO_PATH.write_text(
              "\n".join(hugo_lines).rstrip() + "\n",
              encoding="utf-8",
              newline="\n"
          )

          print()
          print("=" * 70)
          print("GENERATION TERMINEE")
          print("=" * 70)
          print(
              f"Machine Learning : "
              f"{len(ml_projects)} projet(s)"
          )
          print(
              f"Power BI         : "
              f"{len(powerbi_projects)} projet(s)"
          )
          print(
              f"Excel            : "
              f"{len(excel_projects)} projet(s)"
          )
          print(
              f"Python           : "
              f"{len(python_projects)} projet(s)"
          )
          print(
              f"SQL              : "
              f"{len(sql_projects)} projet(s)"
          )
          print()
          print(
              f"Projets Hugo     : "
              f"{len(featured_existing)} projet(s)"
          )
          print()
          print(
              "README.md et content/projets/_index.md "
              "ont ete generes."
          )
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification générée."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"

          git pull --rebase origin main

          git push origin main
