name: Mise à jour Projets de portefeuille

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "Excel/**"
      - "Python/**"
      - "sql/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour-portfolio-projets
  cancel-in-progress: false

jobs:

  update-portfolio:

    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout du dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ================================================================
      # GENERATION README + HUGO
      # ================================================================

      - name: Générer README et page Hugo
        shell: bash
        run: |

          python <<'PY'

          from pathlib import Path
          import re

          # ================================================================
          # CONFIGURATION
          # ================================================================

          REPO_URL = "https://github.com/fbomisso/fabrice.bomisso"

          README_PATH = Path("README.md")
          HUGO_PATH = Path("content/projets/_index.md")

          ROOTS = {
              "Machine Learning": Path("Machine-Learning"),
              "Power BI": Path("PowerBI"),
              "Excel": Path("Excel"),
              "Python": Path("Python"),
              "SQL": Path("sql"),
          }

          # ================================================================
          # DOSSIERS A IGNORER
          # ================================================================

          IGNORED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
              "env",
              ".env",

              "data",
              "Data",
              "raw",
              "Raw",
              "brut",
              "Brut",

              "documentation",
              "Documentation",
              "docs",
              "Docs",

              "captures",
              "Captures",
              "screenshots",
              "Screenshots",

              "notebooks",
              "Notebooks",
              "models",
              "Models",

              "model",
              "Model",

              "application",
              "Application",

              "Visuels_Projet",
              "_template",
          }

          # ================================================================
          # PROJETS VITRINES HUGO
          #
          # HUGO N'AFFICHE QUE CES 5 PROJETS.
          #
          # Le README, lui, affiche TOUS les projets détectés.
          # ================================================================

          FEATURED_PROJECTS = [

              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression/"
                      "01_Prediction_progression_diabete"
                  ),
                  "category": "Machine Learning",
                  "title": "Progression de la prédiction du diabète",
                  "type": "Apprentissage automatique · Régression",
                  "description": (
                      "Projet de régression visant à prédire la progression "
                      "du diabète à partir de variables cliniques."
                  ),
              },

              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression/"
                      "02_Prediction_bruit_aerodynamique"
                  ),
                  "category": "Machine Learning",
                  "title": "Prédiction du bruit aérodynamique",
                  "type": "Apprentissage automatique · Régression",
                  "description": (
                      "Projet de régression consacré à la prédiction "
                      "du bruit aérodynamique."
                  ),
              },

              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "B_Classification/"
                      "01_Customer_Churn"
                  ),
                  "category": "Machine Learning",
                  "title": "Customer Churn",
                  "type": "Apprentissage automatique · Classification",
                  "description": (
                      "Prédiction du churn client avec Random Forest, "
                      "analyse SHAP, segmentation des risques et "
                      "application Streamlit."
                  ),
              },

              {
                  "path": Path(
                      "PowerBI/"
                      "analyse-coupe-du-monde-fifa-2026"
                  ),
                  "category": "Power BI",
                  "title": "Analyse de la Coupe du Monde FIFA 2026",
                  "type": "Power BI",
                  "description": (
                      "Analyse et visualisation de la Coupe du Monde "
                      "FIFA 2026 avec Power BI."
                  ),
              },

              {
                  "path": Path(
                      "PowerBI/"
                      "analyse-performance-football-europe"
                  ),
                  "category": "Power BI",
                  "title": "Analyse de la performance du football européen",
                  "type": "Power BI",
                  "description": (
                      "Analyse de la performance du football européen "
                      "avec Power BI."
                  ),
              },

          ]

          # ================================================================
          # OUTILS
          # ================================================================

          def is_hidden(path):
              return any(
                  part.startswith(".")
                  for part in path.parts
              )


          def is_ignored(path):
              return any(
                  part in IGNORED_DIRS
                  for part in path.parts
              )


          def has_readme(path):
              return (
                  path / "README.md"
              ).is_file()


          def clean_name(name):

              name = name.replace("_", " ")
              name = name.replace("-", " ")

              name = re.sub(
                  r"\s+",
                  " ",
                  name
              )

              return name.strip()


          def remove_number(name):

              return re.sub(
                  r"^\d+[_\-\s]*",
                  "",
                  name
              )


          def github_url(path):

              return (
                  f"{REPO_URL}/tree/main/"
                  f"{path.as_posix()}"
              )


          # ================================================================
          # DETECTION DES PROJETS DIRECTS
          #
          # Pour Power BI / Excel / Python / SQL :
          #
          # Un projet = dossier directement situé dans la racine
          # et contenant README.md.
          # ================================================================

          def detect_direct_projects(root):

              projects = []

              if not root.is_dir():
                  return projects

              for path in root.iterdir():

                  if not path.is_dir():
                      continue

                  if is_hidden(path):
                      continue

                  if is_ignored(path):
                      continue

                  if has_readme(path):
                      projects.append(path)

              return sorted(
                  set(projects),
                  key=lambda p: p.name.lower()
              )


          # ================================================================
          # DETECTION MACHINE LEARNING
          #
          # Un vrai projet ML est un dossier contenant README.md
          # qui ne possède PAS de sous-dossier contenant lui-même README.md.
          #
          # Cela permet d'éviter de considérer comme projets :
          #
          # I_Apprentissage_supervise
          # A_Regression
          # B_Classification
          #
          # Les vrais projets sont :
          #
          # 01_Projet
          # 02_Projet
          # etc.
          # ================================================================

          def has_readme_child(path):

              try:

                  for child in path.iterdir():

                      if not child.is_dir():
                          continue

                      if is_hidden(child):
                          continue

                      if is_ignored(child):
                          continue

                      if has_readme(child):
                          return True

              except OSError:

                  return False

              return False


          def is_real_ml_project(path):

              return (
                  path.is_dir()
                  and not is_hidden(path)
                  and not is_ignored(path)
                  and has_readme(path)
                  and not has_readme_child(path)
              )


          ml_projects = []

          ml_root = ROOTS["Machine Learning"]

          if ml_root.is_dir():

              for path in ml_root.rglob("*"):

                  if is_real_ml_project(path):

                      ml_projects.append(path)


          ml_projects = sorted(
              set(ml_projects),
              key=lambda p: p.as_posix().lower()
          )


          # ================================================================
          # DETECTION DES AUTRES CATEGORIES
          # ================================================================

          powerbi_projects = detect_direct_projects(
              ROOTS["Power BI"]
          )

          excel_projects = detect_direct_projects(
              ROOTS["Excel"]
          )

          python_projects = detect_direct_projects(
              ROOTS["Python"]
          )

          sql_projects = detect_direct_projects(
              ROOTS["SQL"]
          )


          projects_by_category = {

              "Machine Learning": ml_projects,
              "Power BI": powerbi_projects,
              "Excel": excel_projects,
              "Python": python_projects,
              "SQL": sql_projects,

          }


          # ================================================================
          # HIERARCHIE MACHINE LEARNING
          # ================================================================

          def relative_ml_parts(path):

              return path.relative_to(
                  ROOTS["Machine Learning"]
              ).parts


          def level_label(part):

              return clean_name(
                  re.sub(
                      r"^[IVX]+_",
                      "",
                      part
                  )
              )


          def subgroup_label(part):

              return clean_name(
                  re.sub(
                      r"^[A-Z]_",
                      "",
                      part
                  )
              )


          # ================================================================
          # LOGS
          # ================================================================

          print()
          print("=" * 70)
          print("PROJETS DETECTES")
          print("=" * 70)

          for category, projects in projects_by_category.items():

              print()
              print(
                  f"{category}: "
                  f"{len(projects)} projet(s)"
              )

              for project in projects:

                  print(
                      f"  - {project.as_posix()}"
                  )

          print()
          print("=" * 70)


          # ================================================================
          # README
          #
          # LE README CONTIENT TOUS LES PROJETS DETECTES.
          # ================================================================

          START = "<!-- AUTO_STRUCTURE_START -->"
          END = "<!-- AUTO_STRUCTURE_END -->"

          readme_content = README_PATH.read_text(
              encoding="utf-8"
          )

          if START not in readme_content:

              raise ValueError(
                  "AUTO_STRUCTURE_START absent de README.md"
              )

          if END not in readme_content:

              raise ValueError(
                  "AUTO_STRUCTURE_END absent de README.md"
              )


          readme_lines = [
              START,
              "",
          ]


          # ================================================================
          # MACHINE LEARNING
          # ================================================================

          if ml_projects:

              readme_lines.extend([
                  "### 🤖 Apprentissage automatique",
                  "",
              ])

              ml_tree = {}

              for project in ml_projects:

                  parts = relative_ml_parts(project)

                  if len(parts) < 2:
                      continue

                  level = parts[0]

                  subgroup = (
                      parts[1]
                      if len(parts) >= 3
                      else None
                  )

                  ml_tree.setdefault(
                      level,
                      {}
                  ).setdefault(
                      subgroup,
                      []
                  ).append(project)


              for level in sorted(
                  ml_tree,
                  key=lambda x: x.lower()
              ):

                  level_path = (
                      ROOTS["Machine Learning"]
                      / level
                  )

                  level_url = github_url(
                      level_path
                  )

                  readme_lines.extend([
                      f"#### [{level_label(level)}]"
                      f"({level_url})",
                      "",
                  ])


                  subgroups = ml_tree[level]


                  for subgroup in sorted(
                      subgroups,
                      key=lambda x: str(x).lower()
                  ):

                      if subgroup is None:
                          continue

                      subgroup_path = (
                          level_path
                          / subgroup
                      )

                      subgroup_url = github_url(
                          subgroup_path
                      )

                      readme_lines.extend([
                          f"##### [{subgroup_label(subgroup)}]"
                          f"({subgroup_url})",
                          "",
                      ])


                      projects = sorted(
                          subgroups[subgroup],
                          key=lambda p: p.name.lower()
                      )


                      # ------------------------------------------------
                      # NUMEROTATION LOCALE
                      #
                      # Chaque sous-catégorie recommence à 01.
                      #
                      # A Regression :
                      # 01 ...
                      # 02 ...
                      #
                      # B Classification :
                      # 01 ...
                      # 02 ...
                      # ------------------------------------------------

                      for index, project in enumerate(
                          projects,
                          start=1
                      ):

                          name = clean_name(
                              remove_number(
                                  project.name
                              )
                          )

                          readme_lines.append(
                              f"- [{index:02d} {name}]"
                              f"({github_url(project)})"
                          )

                      readme_lines.append("")


          # ================================================================
          # AUTRES CATEGORIES
          #
          # NUMEROTATION INDEPENDANTE
          #
          # Power BI : 01, 02, 03...
          # Excel    : 01, 02, 03...
          # Python   : 01, 02, 03...
          # SQL      : 01, 02, 03...
          # ================================================================

          category_titles = {

              "Power BI": "### 📊 Power BI",

              "Excel": "### 📗 Excel",

              "Python": "### 🐍 Python",

              "SQL": "### 🗄️ SQL",

          }


          for category in [
              "Power BI",
              "Excel",
              "Python",
              "SQL",
          ]:

              projects = projects_by_category[
                  category
              ]

              if not projects:
                  continue


              readme_lines.extend([
                  category_titles[category],
                  "",
              ])


              for index, project in enumerate(
                  projects,
                  start=1
              ):

                  name = clean_name(
                      remove_number(
                          project.name
                      )
                  )

                  readme_lines.append(
                      f"- [{index:02d} {name}]"
                      f"({github_url(project)})"
                  )

              readme_lines.append("")


          readme_lines.append(END)


          generated_readme = "\n".join(
              readme_lines
          )


          start_index = readme_content.index(
              START
          )

          end_index = (
              readme_content.index(END)
              + len(END)
          )


          new_readme = (
              readme_content[:start_index]
              + generated_readme
              + readme_content[end_index:]
          )


          README_PATH.write_text(
              new_readme,
              encoding="utf-8",
              newline="\n"
          )


          # ================================================================
          # HUGO
          #
          # UNIQUEMENT LES 5 PROJETS VITRINES.
          # ================================================================

          hugo_lines = [

              "---",

              'title: "Projets"',

              "---",

              "",

              "Une sélection de projets réalisés en "
              "Business Intelligence, Data Analytics "
              "et Data Science.",

              "",

          ]


          # ================================================================
          # VERIFICATION DES PROJETS VITRINES
          # ================================================================

          featured_existing = []


          for featured in FEATURED_PROJECTS:

              path = featured["path"]


              if not path.is_dir():

                  print(
                      "AVERTISSEMENT : projet vitrine absent : "
                      f"{path}"
                  )

                  continue


              if not has_readme(path):

                  print(
                      "AVERTISSEMENT : README absent : "
                      f"{path}"
                  )

                  continue


              featured_existing.append(
                  featured
              )


          # ================================================================
          # MACHINE LEARNING
          # ================================================================

          featured_ml = [
              p
              for p in featured_existing
              if p["category"] == "Machine Learning"
          ]


          if featured_ml:

              hugo_lines.extend([
                  "## 🤖 Machine Learning",
                  "",
              ])


              # ------------------------------------------------
              # I APPRENTISSAGE SUPERVISE
              # ------------------------------------------------

              supervised_path = Path(
                  "Machine-Learning/"
                  "I_Apprentissage_supervise"
              )

              hugo_lines.extend([
                  "### [I Apprentissage supervise]"
                  f"({github_url(supervised_path)})",
                  "",
              ])


              # ------------------------------------------------
              # A REGRESSION
              # ------------------------------------------------

              regression_path = (
                  supervised_path
                  / "A_Regression"
              )

              featured_regression = [
                  p
                  for p in featured_ml
                  if (
                      p["path"].is_relative_to(
                          regression_path
                      )
                  )
              ]


              if featured_regression:

                  hugo_lines.extend([
                      "#### [A Regression]"
                      f"({github_url(regression_path)})",
                      "",
                  ])


                  for featured in featured_regression:

                      hugo_lines.extend([

                          f"**{featured['title']}**",

                          "",

                          featured["description"],

                          "",

                          f"[Voir le projet]"
                          f"({github_url(featured['path'])})",

                          "",

                      ])


              # ------------------------------------------------
              # B CLASSIFICATION
              # ------------------------------------------------

              classification_path = (
                  supervised_path
                  / "B_Classification"
              )

              featured_classification = [
                  p
                  for p in featured_ml
                  if (
                      p["path"].is_relative_to(
                          classification_path
                      )
                  )
              ]


              if featured_classification:

                  hugo_lines.extend([
                      "#### [B Classification]"
                      f"({github_url(classification_path)})",
                      "",
                  ])


                  for featured in featured_classification:

                      hugo_lines.extend([

                          f"**{featured['title']}**",

                          "",

                          featured["description"],

                          "",

                          f"[Voir le projet]"
                          f"({github_url(featured['path'])})",

                          "",

                      ])


          # ================================================================
          # POWER BI
          # ================================================================

          featured_powerbi = [
              p
              for p in featured_existing
              if p["category"] == "Power BI"
          ]


          if featured_powerbi:

              hugo_lines.extend([
                  "## 📊 Power BI",
                  "",
              ])


              for index, featured in enumerate(
                  featured_powerbi,
                  start=1
              ):

                  hugo_lines.extend([

                      f"### {index:02d} "
                      f"{featured['title']}",

                      "",

                      f"**{featured['type']}**",

                      "",

                      featured["description"],

                      "",

                      f"[Voir le projet]"
                      f"({github_url(featured['path'])})",

                      "",

                  ])


          # ================================================================
          # MESSAGE SI AUCUN PROJET
          # ================================================================

          if not featured_existing:

              hugo_lines.extend([

                  "_Aucun projet vitrine disponible pour le moment._",

                  "",

              ])


          # ================================================================
          # ECRITURE HUGO
          # ================================================================

          HUGO_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          HUGO_PATH.write_text(
              "\n".join(hugo_lines).rstrip()
              + "\n",
              encoding="utf-8",
              newline="\n"
          )


          # ================================================================
          # RESUME
          # ================================================================

          print()
          print("=" * 70)
          print("GENERATION TERMINEE")
          print("=" * 70)

          print(
              f"Machine Learning : "
              f"{len(ml_projects)} projet(s)"
          )

          print(
              f"Power BI : "
              f"{len(powerbi_projects)} projet(s)"
          )

          print(
              f"Excel : "
              f"{len(excel_projects)} projet(s)"
          )

          print(
              f"Python : "
              f"{len(python_projects)} projet(s)"
          )

          print(
              f"SQL : "
              f"{len(sql_projects)} projet(s)"
          )

          print(
              f"Projets Hugo : "
              f"{len(featured_existing)} projet(s)"
          )

          print()
          print(
              "README.md et content/projets/_index.md "
              "ont été générés."
          )

          PY

      # ================================================================
      # COMMIT
      # ================================================================

      - name: Commit des fichiers générés
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification générée."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"

          git pull --rebase origin main

          git push origin main

