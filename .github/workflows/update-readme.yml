name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README project structure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path("README.md")

          # Dossiers racine techniques à ne jamais afficher
          ignored_root_dirs = {
              ".git",
              ".github",
              "assets",
              "content",
              "static",
              "themes",
              "img",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
          }

          # Dossiers internes techniques à ne pas afficher
          ignored_project_dirs = {
              "data",
              "documentation",
              "screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "Data",
              "Documentation",
          }

          # Dossiers qui ne sont pas des projets
          ignored_projects = {
              "_template",
          }

          root_descriptions = {
              "PowerBI": "Projets Power BI, modélisation, DAX et dashboards",
              "Machine-Learning": "Projets de classification, prédiction et Machine Learning",
          }

          project_descriptions = {
              "analyse-coupe-du-monde-fifa-2026":
                  "Analyse et visualisation de la Coupe du Monde FIFA 2026 avec Power BI",

              "analyse-performance-football-europe":
                  "Analyse de la performance du football européen avec Power BI",

              "analyse-performance-olist":
                  "Analyse de performance e-commerce avec Power BI",

              "analyse-pitchside-pro-revenue":
                  "Analyse des revenus et de la performance commerciale avec Power BI",

              "analyse-retail-star-schema":
                  "Analyse retail avec modèle en étoile et Power BI",

              "assurance-automobile-dashboard":
                  "Analyse et pilotage de la performance d'un portefeuille automobile",

              "gap-service":
                  "Analyse et pilotage de la performance du service",

              "pilotage-reseau-distribution-multimagasins":
                  "Pilotage décisionnel d'un réseau de distribution multi-magasins avec Power BI",

              "pilotage-risque-credit-bancaire":
                  "Analyse et pilotage du risque de crédit bancaire",

              "01_Prediction_progression_diabete":
                  "Prédiction de la progression du diabète",

              "02_Prediction_bruit_aerodynamique":
                  "Prédiction du bruit aérodynamique",

              "03_PhysioPredict":
                  "Projet de prédiction appliquée aux données physiologiques",

              "01_Customer_Churn":
                  "Prédiction du churn client",
          }

          def project_link(path):
              readme_path = path / "README.md"

              if readme_path.exists():
                  return f"[Voir le projet](./{path.as_posix()}/README.md)"

              return f"[Voir le dossier](./{path.as_posix()}/)"

          lines = [
              "## Projets",
              "",
              "La liste des projets est générée automatiquement à partir de la structure du dépôt.",
              "",
              "<!-- AUTO_STRUCTURE_START -->",
              ""
          ]

          # ---------------------------------------------------------
          # Machine Learning
          # ---------------------------------------------------------

          ml_root = Path("Machine-Learning")

          if ml_root.exists():

              lines.append("### 🧠 Machine Learning")
              lines.append("")
              lines.append(
                  "Projets de classification, prédiction et Machine Learning."
              )
              lines.append("")

              ml_projects = []

              # Recherche limitée aux README de projets.
              # On ne parcourt pas les dossiers techniques.
              for readme_path in ml_root.rglob("README.md"):

                  project_dir = readme_path.parent

                  if project_dir == ml_root:
                      continue

                  parts = project_dir.parts

                  if any(part in ignored_project_dirs for part in parts):
                      continue

                  # README des catégories intermédiaires
                  if project_dir.name in {
                      "I_Apprentissage_supervise",
                      "A_Regression",
                      "B_Classification",
                  }:
                      continue

                  ml_projects.append(project_dir)

              # Évite les doublons
              ml_projects = sorted(set(ml_projects))

              for project in ml_projects:

                  description = project_descriptions.get(
                      project.name,
                      "Projet Machine Learning"
                  )

                  lines.append(
                      f"- **{description}** — {project_link(project)}"
                  )

              lines.append("")

          # ---------------------------------------------------------
          # Power BI
          # ---------------------------------------------------------

          powerbi_root = Path("PowerBI")

          if powerbi_root.exists():

              lines.append("### 📊 Power BI")
              lines.append("")
              lines.append(
                  "Projets de Business Intelligence, analyse de données, "
                  "modélisation, DAX et dashboards."
              )
              lines.append("")

              powerbi_projects = []

              for project in powerbi_root.iterdir():

                  if not project.is_dir():
                      continue

                  if project.name in ignored_projects:
                      continue

                  if project.name in ignored_project_dirs:
                      continue

                  if project.name.startswith("."):
                      continue

                  # Un vrai projet possède un README.
                  if (project / "README.md").exists():
                      powerbi_projects.append(project)

              for project in sorted(powerbi_projects, key=lambda p: p.name.lower()):

                  description = project_descriptions.get(
                      project.name,
                      "Projet du portfolio Power BI"
                  )

                  lines.append(
                      f"- **{description}** — {project_link(project)}"
                  )

              lines.append("")

          lines.append("<!-- AUTO_STRUCTURE_END -->")

          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO_STRUCTURE_START -->"
          end = "<!-- AUTO_STRUCTURE_END -->"

          if start not in content or end not in content:
              raise ValueError(
                  "Les balises AUTO_STRUCTURE_START et AUTO_STRUCTURE_END "
                  "sont absentes du README.md."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          structure_start = content.rfind(
              "## Projets",
              0,
              start_index
          )

          if structure_start == -1:
              raise ValueError(
                  "La section '## Projets' est introuvable."
              )

          new_section = "\n".join(lines)

          content = (
              content[:structure_start]
              + new_section
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8"
          )
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README."
          else
            git commit -m "chore: update README structure"
            git push
          fi
