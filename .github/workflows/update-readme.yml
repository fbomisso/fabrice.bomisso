name: Update Portfolio Projects

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "Excel/**"
      - "Python/**"
      - "sql/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-projects
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect projects and generate README + Hugo
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          REPO_URL = "https://github.com/fbomisso/fabrice.bomisso"

          README_PATH = Path("README.md")
          HUGO_PATH = Path("content/projets/_index.md")

          # ============================================================
          # DOSSIERS TECHNIQUES A IGNORER
          # ============================================================

          IGNORED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
              "env",
              ".env",

              "data",
              "Data",
              "raw",
              "documentation",
              "Documentation",
              "docs",
              "Docs",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "model",
              "app",
              "Visuels_Projet",
              "_template",
          }

          # ============================================================
          # STRUCTURE MACHINE LEARNING
          #
          # La numérotation est réinitialisée dans chaque sous-catégorie.
          #
          # A_Regression
          #   01 Projet
          #   02 Projet
          #
          # B_Classification
          #   01 Projet
          #   02 Projet
          #
          # ============================================================

          ML_STRUCTURE = [
              (
                  "I_Apprentissage_supervise",
                  "I Apprentissage supervisé",
                  [
                      ("A_Regression", "A Régression"),
                      ("B_Classification", "B Classification"),
                  ],
              ),
              (
                  "II_Apprentissage_non_supervise",
                  "II Apprentissage non supervisé",
                  [
                      ("A_Clustering", "A Clustering"),
                      ("B_Detection_anomalies", "B Détection d'anomalies"),
                      ("C_Reduction_dimension", "C Réduction de dimension"),
                  ],
              ),
              (
                  "III_Apprentissage par renforcement",
                  "III Apprentissage par renforcement",
                  [],
              ),
              (
                  "IV_Deep Learning",
                  "IV Deep Learning",
                  [],
              ),
          ]

          # ============================================================
          # DESCRIPTIONS PERSONNALISEES
          # ============================================================

          CUSTOM_DESCRIPTIONS = {

              "Machine-Learning/I_Apprentissage_supervise/"
              "A_Regression/01_Prediction_progression_diabete":
                  "Projet de régression visant à prédire la progression "
                  "du diabète à partir de variables cliniques.",

              "Machine-Learning/I_Apprentissage_supervise/"
              "A_Regression/02_Prediction_bruit_aerodynamique":
                  "Projet de régression consacré à la prédiction du "
                  "bruit aérodynamique.",

              "Machine-Learning/I_Apprentissage_supervise/"
              "B_Classification/01_Customer_Churn":
                  "Prédiction du churn client avec Random Forest, "
                  "analyse SHAP, segmentation des risques et "
                  "application Streamlit.",

              "PowerBI/analyse-coupe-du-monde-fifa-2026":
                  "Analyse et visualisation de la Coupe du Monde FIFA "
                  "2026 avec Power BI.",

              "PowerBI/analyse-performance-football-europe":
                  "Analyse de la performance du football européen "
                  "avec Power BI.",

              "PowerBI/analyse-performance-olist":
                  "Analyse de la performance e-commerce avec Power BI.",

              "PowerBI/analyse-pitchside-pro-revenue":
                  "Analyse des revenus et de la performance commerciale "
                  "avec Power BI.",

              "PowerBI/analyse-retail-star-schema":
                  "Analyse retail avec modèle en étoile, audit DAX "
                  "et validation des indicateurs.",

              "PowerBI/assurance-automobile-dashboard":
                  "Analyse et pilotage de la performance d'un "
                  "portefeuille automobile.",

              "PowerBI/gap-service":
                  "Analyse et pilotage de la performance du service.",

              "PowerBI/pilotage-reseau-distribution-multimagasins":
                  "Pilotage décisionnel d'un réseau de distribution "
                  "multi-magasins avec Power BI.",

              "PowerBI/pilotage-risque-credit-bancaire":
                  "Analyse et pilotage du risque de crédit bancaire.",
          }

          # ============================================================
          # OUTILS
          # ============================================================

          def is_hidden(path: Path):
              return any(
                  part.startswith(".")
                  for part in path.parts
              )

          def is_ignored(path: Path):
              return any(
                  part in IGNORED_DIRS
                  for part in path.parts
              )

          def has_readme(path: Path):
              return (path / "README.md").is_file()

          def clean_name(name: str):
              name = name.replace("_", " ")
              name = name.replace("-", " ")
              name = re.sub(r"\s+", " ", name).strip()
              return name

          def github_url(path: Path):
              return (
                  f"{REPO_URL}/tree/main/"
                  f"{path.as_posix()}"
              )

          def description(path: Path, category: str):
              key = path.as_posix()

              if key in CUSTOM_DESCRIPTIONS:
                  return CUSTOM_DESCRIPTIONS[key]

              descriptions = {
                  "Power BI":
                      "Projet de Business Intelligence réalisé "
                      "avec Power BI.",

                  "Excel":
                      "Projet d'analyse et de traitement de données "
                      "réalisé avec Excel.",

                  "Python":
                      "Projet d'analyse et de traitement de données "
                      "réalisé avec Python.",

                  "SQL":
                      "Projet d'analyse et de traitement de données "
                      "réalisé avec SQL.",

                  "Machine Learning":
                      "Projet de Machine Learning consacré à "
                      "l'analyse, la modélisation et la prédiction "
                      "à partir de données.",
              }

              return descriptions.get(
                  category,
                  "Projet présenté dans le portfolio."
              )

          # ============================================================
          # DETECTION DES PROJETS D'UNE CATEGORIE DIRECTE
          #
          # Exemple :
          #
          # PowerBI/
          #   projet1/
          #     README.md
          #
          # Excel/
          #   projet1/
          #     README.md
          #
          # ============================================================

          def detect_direct_projects(root: Path):

              projects = []

              if not root.is_dir():
                  return projects

              for path in root.iterdir():

                  if not path.is_dir():
                      continue

                  if is_hidden(path):
                      continue

                  if is_ignored(path):
                      continue

                  if not has_readme(path):
                      continue

                  projects.append(path)

              return sorted(
                  projects,
                  key=lambda p: p.name.lower()
              )

          # ============================================================
          # DETECTION MACHINE LEARNING
          #
          # IMPORTANT :
          # Les dossiers organisationnels ne sont jamais affichés comme
          # projets.
          #
          # La numérotation est locale à chaque sous-catégorie.
          # ============================================================

          ml_categories = []

          ml_root = Path("Machine-Learning")

          for category_folder, category_name, subcategories in ML_STRUCTURE:

              category_path = ml_root / category_folder

              if not category_path.is_dir():
                  continue

              category_data = []

              # --------------------------------------------------------
              # Catégories avec sous-catégories
              # --------------------------------------------------------

              if subcategories:

                  for subfolder, subfolder_name in subcategories:

                      sub_path = category_path / subfolder

                      if not sub_path.is_dir():
                          continue

                      projects = []

                      for project in sub_path.iterdir():

                          if not project.is_dir():
                              continue

                          if is_hidden(project):
                              continue

                          if is_ignored(project):
                              continue

                          if not has_readme(project):
                              continue

                          projects.append(project)

                      projects = sorted(
                          projects,
                          key=lambda p: p.name.lower()
                      )

                      if projects:
                          category_data.append(
                              (
                                  subfolder_name,
                                  projects
                              )
                          )

              # --------------------------------------------------------
              # Catégories sans sous-catégories
              #
              # III Apprentissage par renforcement
              # IV Deep Learning
              # --------------------------------------------------------

              else:

                  projects = []

                  for project in category_path.iterdir():

                      if not project.is_dir():
                          continue

                      if is_hidden(project):
                          continue

                      if is_ignored(project):
                          continue

                      if not has_readme(project):
                          continue

                      projects.append(project)

                  projects = sorted(
                      projects,
                      key=lambda p: p.name.lower()
                  )

                  if projects:
                      category_data.append(
                          (
                              None,
                              projects
                          )
                      )

              if category_data:
                  ml_categories.append(
                      (
                          category_name,
                          category_data
                      )
                  )

          # ============================================================
          # POWER BI
          # ============================================================

          powerbi_projects = detect_direct_projects(
              Path("PowerBI")
          )

          # ============================================================
          # EXCEL
          # ============================================================

          excel_projects = detect_direct_projects(
              Path("Excel")
          )

          # ============================================================
          # PYTHON
          # ============================================================

          python_projects = detect_direct_projects(
              Path("Python")
          )

          # ============================================================
          # SQL
          # ============================================================

          sql_projects = detect_direct_projects(
              Path("sql")
          )

          # ============================================================
          # LOGS
          # ============================================================

          print()
          print("=" * 70)
          print("PROJETS DETECTES")
          print("=" * 70)

          print()
          print("MACHINE LEARNING")

          for category_name, subcategories in ml_categories:

              print(f"  {category_name}")

              for subcategory_name, projects in subcategories:

                  if subcategory_name:
                      print(f"    {subcategory_name}")

                  for index, project in enumerate(projects, 1):

                      print(
                          f"      {index:02d} - "
                          f"{project.as_posix()}"
                      )

          for category_name, projects in [
              ("Power BI", powerbi_projects),
              ("Excel", excel_projects),
              ("Python", python_projects),
              ("SQL", sql_projects),
          ]:

              print()
              print(
                  f"{category_name} : "
                  f"{len(projects)} projet(s)"
              )

              for index, project in enumerate(projects, 1):

                  print(
                      f"  {index:02d} - "
                      f"{project.as_posix()}"
                  )

          print()
          print("=" * 70)

          # ============================================================
          # README
          # ============================================================

          START = "<!-- AUTO_STRUCTURE_START -->"
          END = "<!-- AUTO_STRUCTURE_END -->"

          readme_content = README_PATH.read_text(
              encoding="utf-8"
          )

          if START not in readme_content:
              raise ValueError(
                  "AUTO_STRUCTURE_START est absent du README.md."
              )

          if END not in readme_content:
              raise ValueError(
                  "AUTO_STRUCTURE_END est absent du README.md."
              )

          readme_lines = [
              START,
              "",
          ]

          # ------------------------------------------------------------
          # MACHINE LEARNING
          # ------------------------------------------------------------

          if ml_categories:

              readme_lines.extend([
                  "### 🤖 Machine Learning",
                  "",
              ])

              for category_name, subcategories in ml_categories:

                  category_path = next(
                      (
                          ml_root / folder
                          for folder, name, subs in ML_STRUCTURE
                          if name == category_name
                      ),
                      None
                  )

                  if category_path:

                      readme_lines.extend([
                          f"#### [{category_name}]"
                          f"({github_url(category_path)})",
                          "",
                      ])

                  for subcategory_name, projects in subcategories:

                      if subcategory_name:

                          # Trouver le chemin de la sous-catégorie
                          sub_path = None

                          for folder, name, subs in ML_STRUCTURE:

                              if name == category_name:

                                  for subfolder, subname in subs:

                                      if subname == subcategory_name:

                                          sub_path = (
                                              ml_root
                                              / folder
                                              / subfolder
                                          )

                          if sub_path:

                              readme_lines.extend([
                                  f"**[{subcategory_name}]"
                                  f"({github_url(sub_path)})**",
                                  "",
                              ])

                      for index, project in enumerate(
                          projects,
                          1
                      ):

                          readme_lines.append(
                              f"- {index:02d} "
                              f"[{clean_name(project.name)}]"
                              f"({github_url(project)})"
                          )

                      readme_lines.append("")

          # ------------------------------------------------------------
          # CATEGORIES DIRECTES
          # ------------------------------------------------------------

          direct_categories = [
              (
                  "Power BI",
                  "📊",
                  powerbi_projects
              ),
              (
                  "Excel",
                  "📗",
                  excel_projects
              ),
              (
                  "Python",
                  "🐍",
                  python_projects
              ),
              (
                  "SQL",
                  "🗄️",
                  sql_projects
              ),
          ]

          for category, emoji, projects in direct_categories:

              if not projects:
                  continue

              readme_lines.extend([
                  f"### {emoji} {category}",
                  "",
              ])

              for index, project in enumerate(
                  projects,
                  1
              ):

                  readme_lines.append(
                      f"- {index:02d} "
                      f"[{clean_name(project.name)}]"
                      f"({github_url(project)})"
                  )

              readme_lines.append("")

          if not any([
              ml_categories,
              powerbi_projects,
              excel_projects,
              python_projects,
              sql_projects,
          ]):

              readme_lines.extend([
                  "_Aucun projet disponible pour le moment._",
                  "",
              ])

          readme_lines.append(END)

          generated_readme = "\n".join(readme_lines)

          start_index = readme_content.index(START)

          end_index = (
              readme_content.index(END)
              + len(END)
          )

          new_readme = (
              readme_content[:start_index]
              + generated_readme
              + readme_content[end_index:]
          )

          README_PATH.write_text(
              new_readme,
              encoding="utf-8",
              newline="\n",
          )

          # ============================================================
          # HUGO
          # ============================================================

          hugo_lines = [
              "---",
              'title: "Projets"',
              "---",
              "",
              "Une sélection de projets réalisés en "
              "Business Intelligence, Data Analytics et "
              "Data Science.",
              "",
          ]

          # ------------------------------------------------------------
          # MACHINE LEARNING HUGO
          # ------------------------------------------------------------

          if ml_categories:

              hugo_lines.extend([
                  "## 🤖 Machine Learning",
                  "",
              ])

              for category_name, subcategories in ml_categories:

                  category_path = next(
                      (
                          ml_root / folder
                          for folder, name, subs in ML_STRUCTURE
                          if name == category_name
                      ),
                      None
                  )

                  if category_path:

                      hugo_lines.extend([
                          f"### [{category_name}]"
                          f"({github_url(category_path)})",
                          "",
                      ])

                  for subcategory_name, projects in subcategories:

                      if subcategory_name:

                          sub_path = None

                          for folder, name, subs in ML_STRUCTURE:

                              if name == category_name:

                                  for subfolder, subname in subs:

                                      if subname == subcategory_name:

                                          sub_path = (
                                              ml_root
                                              / folder
                                              / subfolder
                                          )

                          if sub_path:

                              hugo_lines.extend([
                                  f"#### [{subcategory_name}]"
                                  f"({github_url(sub_path)})",
                                  "",
                              ])

                      for index, project in enumerate(
                          projects,
                          1
                      ):

                          hugo_lines.extend([
                              f"##### {index:02d} "
                              f"{clean_name(project.name)}",
                              "",
                              "**Machine Learning**",
                              "",
                              description(
                                  project,
                                  "Machine Learning"
                              ),
                              "",
                              f"[Voir le projet]"
                              f"({github_url(project)})",
                              "",
                          ])

          # ------------------------------------------------------------
          # POWER BI / EXCEL / PYTHON / SQL HUGO
          # ------------------------------------------------------------

          for category, emoji, projects in direct_categories:

              if not projects:
                  continue

              hugo_lines.extend([
                  f"## {emoji} {category}",
                  "",
              ])

              for index, project in enumerate(
                  projects,
                  1
              ):

                  hugo_lines.extend([
                      f"### {index:02d} "
                      f"{clean_name(project.name)}",
                      "",
                      f"**{category}**",
                      "",
                      description(
                          project,
                          category
                      ),
                      "",
                      f"[Voir le projet]"
                      f"({github_url(project)})",
                      "",
                  ])

          # ------------------------------------------------------------
          # TOUS LES PROJETS
          # ------------------------------------------------------------

          hugo_lines.extend([
              "## Tous mes projets",
              "",
          ])

          category_paths = [
              (
                  "Machine Learning",
                  "Machine-Learning"
              ),
              (
                  "Power BI",
                  "PowerBI"
              ),
              (
                  "Excel",
                  "Excel"
              ),
              (
                  "Python",
                  "Python"
              ),
              (
                  "SQL",
                  "sql"
              ),
          ]

          for category, path in category_paths:

              root = Path(path)

              if root.is_dir():

                  hugo_lines.extend([
                      f"- [{category}]"
                      f"({github_url(root)})",
                      "",
                  ])

          HUGO_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          HUGO_PATH.write_text(
              "\n".join(hugo_lines).rstrip() + "\n",
              encoding="utf-8",
              newline="\n",
          )

          # ============================================================
          # FIN
          # ============================================================

          print()
          print("=" * 70)
          print("GENERATION TERMINEE")
          print("=" * 70)
          print()
          print("README.md et Hugo ont ete mis a jour.")
          print()
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"
          git push origin main
