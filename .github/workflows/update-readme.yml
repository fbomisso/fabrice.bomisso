name: Update README

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "README.md"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-main-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project structure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path("README.md")

          ignored_dirs = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "data",
              "Data",
              "documentation",
              "Documentation",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "_template",
          }

          def clean_name(name):
              return name.replace("-", " ").replace("_", " ")

          def github_link(path):
              relative = path.as_posix()
              return (
                  "https://github.com/fbomisso/fabrice.bomisso/"
                  f"tree/main/{relative}"
              )

          def is_project(path):
              return (
                  path.is_dir()
                  and path.name not in ignored_dirs
                  and not path.name.startswith(".")
                  and (path / "README.md").is_file()
              )

          lines = [
              "## Projets",
              "",
              "La liste des projets est générée automatiquement à partir des projets présents dans le dépôt.",
              "",
              "<!-- AUTO_STRUCTURE_START -->",
              "",
          ]

          # ============================================================
          # MACHINE LEARNING
          # ============================================================

          ml_root = Path("Machine-Learning")

          if ml_root.is_dir():

              lines.extend([
                  "### 🤖 Machine Learning",
                  "",
              ])

              # --------------------------------------------------------
              # I. APPRENTISSAGE SUPERVISÉ
              # --------------------------------------------------------

              supervised = ml_root / "I_Apprentissage_supervise"

              if supervised.is_dir():

                  lines.extend([
                      "#### 📚 I. Apprentissage supervisé",
                      "",
                  ])

                  # ----------------------------------------------------
                  # A. RÉGRESSION
                  # ----------------------------------------------------

                  regression = supervised / "A_Regression"

                  if regression.is_dir():

                      lines.extend([
                          "##### 📈 A. Régression",
                          "",
                      ])

                      projects = sorted(
                          (
                              p for p in regression.iterdir()
                              if is_project(p)
                          ),
                          key=lambda p: p.name.lower()
                      )

                      for project in projects:
                          name = clean_name(project.name)
                          url = github_link(project)
                          lines.append(f"- [{name}]({url})")

                      lines.append("")

                  # ----------------------------------------------------
                  # B. CLASSIFICATION
                  # ----------------------------------------------------

                  classification = supervised / "B_Classification"

                  if classification.is_dir():

                      lines.extend([
                          "##### 🏷️ B. Classification",
                          "",
                      ])

                      projects = sorted(
                          (
                              p for p in classification.iterdir()
                              if is_project(p)
                          ),
                          key=lambda p: p.name.lower()
                      )

                      for project in projects:
                          name = clean_name(project.name)
                          url = github_link(project)
                          lines.append(f"- [{name}]({url})")

                      lines.append("")

              # --------------------------------------------------------
              # II. APPRENTISSAGE NON SUPERVISÉ
              # --------------------------------------------------------

              unsupervised = ml_root / "II_Apprentissage_non_supervise"

              if unsupervised.is_dir():

                  lines.extend([
                      "#### 📚 II. Apprentissage non supervisé",
                      "",
                  ])

                  categories = sorted(
                      (
                          p for p in unsupervised.iterdir()
                          if (
                              p.is_dir()
                              and p.name not in ignored_dirs
                              and not p.name.startswith(".")
                          )
                      ),
                      key=lambda p: p.name.lower()
                  )

                  for category in categories:

                      lines.extend([
                          f"##### 📁 {clean_name(category.name)}",
                          "",
                      ])

                      projects = sorted(
                          (
                              p for p in category.iterdir()
                              if is_project(p)
                          ),
                          key=lambda p: p.name.lower()
                      )

                      for project in projects:
                          name = clean_name(project.name)
                          url = github_link(project)
                          lines.append(f"- [{name}]({url})")

                      lines.append("")

          # ============================================================
          # POWER BI
          # ============================================================

          powerbi_root = Path("PowerBI")

          if powerbi_root.is_dir():

              lines.extend([
                  "### 📊 Power BI",
                  "",
              ])

              projects = sorted(
                  (
                      p for p in powerbi_root.iterdir()
                      if is_project(p)
                  ),
                  key=lambda p: p.name.lower()
              )

              for project in projects:
                  name = clean_name(project.name)
                  url = github_link(project)
                  lines.append(f"- [{name}]({url})")

              lines.append("")

          lines.append("<!-- AUTO_STRUCTURE_END -->")

          # ============================================================
          # UPDATE README
          # ============================================================

          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO_STRUCTURE_START -->"
          end = "<!-- AUTO_STRUCTURE_END -->"

          if start not in content:
              raise ValueError(
                  "AUTO_STRUCTURE_START est absent du README."
              )

          if end not in content:
              raise ValueError(
                  "AUTO_STRUCTURE_END est absent du README."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          section_start = content.rfind(
              "## Projets",
              0,
              start_index
          )

          if section_start == -1:
              raise ValueError(
                  "Impossible de trouver la section '## Projets'."
              )

          generated = "\n".join(lines)

          content = (
              content[:section_start]
              + generated
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8",
              newline="\n"
          )

          print("README.md mis à jour avec succès.")
          PY

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README."
          else
            git commit -m "chore: update README structure"
            git push
          fi