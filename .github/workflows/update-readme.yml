name: Mise à jour automatique du portefeuille

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "Excel/**"
      - "Python/**"
      - "sql/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-projects
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout du dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Générer README et page Hugo
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          REPO_URL = "https://github.com/fbomisso/fabrice.bomisso"

          README_PATH = Path("README.md")
          HUGO_PATH = Path("content/projets/_index.md")

          ROOTS = {
              "Machine Learning": Path("Machine-Learning"),
              "Power BI": Path("PowerBI"),
              "Excel": Path("Excel"),
              "Python": Path("Python"),
              "SQL": Path("sql"),
          }

          IGNORED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
              "env",
              ".env",
              "data",
              "Data",
              "brut",
              "documentation",
              "Documentation",
              "docs",
              "Docs",
              "captures d'écran",
              "Captures d'écran",
              "cahiers",
              "models",
              "modèles",
              "application",
              "Visuels_Projet",
              "_template",
          }

          # ================================================================
          # PROJETS VITRINES HUGO
          # ================================================================
          # Hugo n'affiche que ces 5 projets.
          # Le README, lui, affiche automatiquement tous les projets.
          # ================================================================

          FEATURED_PROJECTS = [
              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression/"
                      "01_Prediction_progression_diabete"
                  ),
                  "category": "Machine Learning",
                  "title": "Progression de la prédiction du diabète",
                  "type": "Machine Learning · Régression",
                  "description": (
                      "Projet de régression visant à prédire la progression "
                      "du diabète à partir de variables cliniques."
                  ),
              },
              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression/"
                      "02_Prediction_bruit_aerodynamique"
                  ),
                  "category": "Machine Learning",
                  "title": "Prédiction du bruit aérodynamique",
                  "type": "Machine Learning · Régression",
                  "description": (
                      "Projet de régression consacré à la prédiction "
                      "du bruit aérodynamique."
                  ),
              },
              {
                  "path": Path(
                      "Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "B_Classification/"
                      "01_Customer_Churn"
                  ),
                  "category": "Machine Learning",
                  "title": "Customer Churn",
                  "type": "Machine Learning · Classification",
                  "description": (
                      "Prédiction du churn client avec Random Forest, "
                      "analyse SHAP, segmentation des risques et "
                      "application Streamlit."
                  ),
              },
              {
                  "path": Path(
                      "PowerBI/"
                      "analyse-coupe-du-monde-fifa-2026"
                  ),
                  "category": "Power BI",
                  "title": "Analyse de la Coupe du Monde FIFA 2026",
                  "type": "Power BI",
                  "description": (
                      "Analyse et visualisation de la Coupe du Monde "
                      "FIFA 2026 avec Power BI."
                  ),
              },
              {
                  "path": Path(
                      "PowerBI/"
                      "analyse-performance-football-europe"
                  ),
                  "category": "Power BI",
                  "title": "Analyse de la performance du football européen",
                  "type": "Power BI",
                  "description": (
                      "Analyse de la performance du football européen "
                      "avec Power BI."
                  ),
              },
          ]

          # ================================================================
          # OUTILS
          # ================================================================

          def is_hidden(path):
              return any(part.startswith(".") for part in path.parts)

          def is_ignored(path):
              return any(part in IGNORED_DIRS for part in path.parts)

          def has_readme(path):
              return (path / "README.md").is_file()

          def clean_name(name):
              name = name.replace("_", " ")
              name = name.replace("-", " ")
              name = re.sub(r"\s+", " ", name)
              return name.strip()

          def github_url(path):
              return f"{REPO_URL}/tree/main/{path.as_posix()}"

          # ================================================================
          # DETECTION PROJETS DIRECTS
          # ================================================================

          def detect_direct_projects(root):
              projects = []

              if not root.is_dir():
                  return projects

              for path in root.iterdir():
                  if (
                      path.is_dir()
                      and not is_hidden(path)
                      and not is_ignored(path)
                      and has_readme(path)
                  ):
                      projects.append(path)

              return sorted(
                  set(projects),
                  key=lambda p: p.name.lower()
              )

          # ================================================================
          # DETECTION MACHINE LEARNING
          # ================================================================

          def is_real_ml_project(path):
              if not path.is_dir():
                  return False

              if is_hidden(path):
                  return False

              if is_ignored(path):
                  return False

              if not has_readme(path):
                  return False

              # Un dossier contenant lui-même des dossiers projets
              # n'est pas considéré comme un projet final.
              for child in path.iterdir():
                  if (
                      child.is_dir()
                      and not is_hidden(child)
                      and not is_ignored(child)
                      and has_readme(child)
                  ):
                      return False

              return True

          ml_projects = []

          ml_root = ROOTS["Machine Learning"]

          if ml_root.is_dir():
              for path in ml_root.rglob("*"):
                  if is_real_ml_project(path):
                      ml_projects.append(path)

          ml_projects = sorted(
              set(ml_projects),
              key=lambda p: p.as_posix().lower()
          )

          # ================================================================
          # AUTRES CATÉGORIES
          # ================================================================

          powerbi_projects = detect_direct_projects(
              ROOTS["Power BI"]
          )

          excel_projects = detect_direct_projects(
              ROOTS["Excel"]
          )

          python_projects = detect_direct_projects(
              ROOTS["Python"]
          )

          sql_projects = detect_direct_projects(
              ROOTS["SQL"]
          )

          projects_by_category = {
              "Machine Learning": ml_projects,
              "Power BI": powerbi_projects,
              "Excel": excel_projects,
              "Python": python_projects,
              "SQL": sql_projects,
          }

          # ================================================================
          # LABELS MACHINE LEARNING
          # ================================================================

          def level_label(part):
              return clean_name(
                  re.sub(r"^[IVX]+_", "", part)
              )

          def subgroup_label(part):
              return clean_name(
                  re.sub(r"^[A-Z]_", "", part)
              )

          # ================================================================
          # LOGS
          # ================================================================

          print()
          print("=" * 70)
          print("PROJETS DETECTES")
          print("=" * 70)

          for category, projects in projects_by_category.items():
              print()
              print(f"{category}: {len(projects)} projet(s)")

              for project in projects:
                  print(f"  - {project.as_posix()}")

          print()
          print("=" * 70)

          # ================================================================
          # README
          # ================================================================

          START = "<!-- AUTO_STRUCTURE_START -->"
          END = "<!-- AUTO_STRUCTURE_END -->"

          readme_content = README_PATH.read_text(
              encoding="utf-8"
          )

          # Si les marqueurs n'existent pas encore,
          # ils sont ajoutés à la fin du README.
          if START not in readme_content:
              readme_content = (
                  readme_content.rstrip()
                  + "\n\n"
                  + START
                  + "\n\n"
                  + END
                  + "\n"
              )

          readme_lines = [
              START,
              "",
              "## Projets",
              "",
              "La liste des projets est générée automatiquement "
              "à partir des projets présents dans le dépôt.",
              "",
          ]

          # ================================================================
          # MACHINE LEARNING
          # ================================================================

          if ml_projects:

              readme_lines.extend([
                  "### 🤖 Machine Learning",
                  "",
              ])

              ml_tree = {}

              for project in ml_projects:

                  parts = project.relative_to(
                      ROOTS["Machine Learning"]
                  ).parts

                  if len(parts) < 2:
                      continue

                  level = parts[0]

                  subgroup = (
                      parts[1]
                      if len(parts) >= 3
                      else None
                  )

                  ml_tree.setdefault(
                      level,
                      {}
                  ).setdefault(
                      subgroup,
                      []
                  ).append(project)

              for level in sorted(
                  ml_tree,
                  key=lambda x: x.lower()
              ):

                  level_path = (
                      ROOTS["Machine Learning"] / level
                  )

                  readme_lines.extend([
                      f"#### [{level_label(level)}]"
                      f"({github_url(level_path)})",
                      "",
                  ])

                  subgroups = ml_tree[level]

                  for subgroup in sorted(
                      subgroups,
                      key=lambda x: str(x).lower()
                  ):

                      if subgroup is None:
                          continue

                      subgroup_path = (
                          level_path / subgroup
                      )

                      readme_lines.extend([
                          f"##### [{subgroup_label(subgroup)}]"
                          f"({github_url(subgroup_path)})",
                          "",
                      ])

                      projects = sorted(
                          subgroups[subgroup],
                          key=lambda p: p.name.lower()
                      )

                      for index, project in enumerate(
                          projects,
                          start=1
                      ):

                          name = clean_name(
                              re.sub(
                                  r"^\d+_",
                                  "",
                                  project.name
                              )
                          )

                          readme_lines.append(
                              f"- [{index:02d} {name}]"
                              f"({github_url(project)})"
                          )

                      readme_lines.append("")

          # ================================================================
          # POWER BI / EXCEL / PYTHON / SQL
          # ================================================================

          category_titles = {
              "Power BI": "### 📊 Power BI",
              "Excel": "### 📗 Excel",
              "Python": "### 🐍 Python",
              "SQL": "### 🗄️ SQL",
          }

          for category in [
              "Power BI",
              "Excel",
              "Python",
              "SQL",
          ]:

              projects = projects_by_category[category]

              if not projects:
                  continue

              readme_lines.extend([
                  category_titles[category],
                  "",
              ])

              for index, project in enumerate(
                  projects,
                  start=1
              ):

                  name = clean_name(
                      re.sub(
                          r"^\d+_",
                          "",
                          project.name
                      )
                  )

                  readme_lines.append(
                      f"- [{index:02d} {name}]"
                      f"({github_url(project)})"
                  )

              readme_lines.append("")

          readme_lines.append(END)

          generated_readme = "\n".join(readme_lines)

          start_index = readme_content.index(START)

          end_index = (
              readme_content.index(END)
              + len(END)
          )

          new_readme = (
              readme_content[:start_index]
              + generated_readme
              + readme_content[end_index:]
          )

          README_PATH.write_text(
              new_readme,
              encoding="utf-8",
              newline="\n"
          )

          # ================================================================
          # HUGO
          # ================================================================
          # UNIQUEMENT LES 5 PROJETS VITRINES
          # ================================================================

          hugo_lines = [
              "---",
              'title: "Projets"',
              "---",
              "",
              "Une sélection de projets réalisés en "
              "Business Intelligence, Data Analytics "
              "et Data Science.",
              "",
          ]

          featured_existing = []

          for featured in FEATURED_PROJECTS:

              path = featured["path"]

              if not path.is_dir():
                  print(
                      f"AVERTISSEMENT : projet vitrine absent : {path}"
                  )
                  continue

              if not has_readme(path):
                  print(
                      f"AVERTISSEMENT : README absent : {path}"
                  )
                  continue

              featured_existing.append(featured)

          # ================================================================
          # MACHINE LEARNING HUGO
          # ================================================================

          featured_ml = [
              p
              for p in featured_existing
              if p["category"] == "Machine Learning"
          ]

          if featured_ml:

              hugo_lines.extend([
                  "## 🤖 Machine Learning",
                  "",
              ])

              hugo_lines.extend([
                  "### [I Apprentissage supervise]"
                  f"({github_url(Path("
                  "'Machine-Learning/"
                  "I_Apprentissage_supervise'"
                  "))})",
                  "",
              ])

              featured_regression = [
                  p
                  for p in featured_ml
                  if (
                      "I_Apprentissage_supervise/"
                      "A_Regression/"
                  ) in p["path"].as_posix()
              ]

              if featured_regression:

                  hugo_lines.extend([
                      "#### [A Regression]"
                      f"({github_url(Path("
                      "'Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "A_Regression'"
                      "))})",
                      "",
                  ])

                  for featured in featured_regression:

                      hugo_lines.extend([
                          f"**{featured['title']}**",
                          "",
                          featured["description"],
                          "",
                          f"[Voir le projet]"
                          f"({github_url(featured['path'])})",
                          "",
                      ])

              featured_classification = [
                  p
                  for p in featured_ml
                  if (
                      "I_Apprentissage_supervise/"
                      "B_Classification/"
                  ) in p["path"].as_posix()
              ]

              if featured_classification:

                  hugo_lines.extend([
                      "#### [B Classification]"
                      f"({github_url(Path("
                      "'Machine-Learning/"
                      "I_Apprentissage_supervise/"
                      "B_Classification'"
                      "))})",
                      "",
                  ])

                  for featured in featured_classification:

                      hugo_lines.extend([
                          f"**{featured['title']}**",
                          "",
                          featured["description"],
                          "",
                          f"[Voir le projet]"
                          f"({github_url(featured['path'])})",
                          "",
                      ])

          # ================================================================
          # POWER BI HUGO
          # ================================================================

          featured_powerbi = [
              p
              for p in featured_existing
              if p["category"] == "Power BI"
          ]

          if featured_powerbi:

              hugo_lines.extend([
                  "## 📊 Power BI",
                  "",
              ])

              for index, featured in enumerate(
                  featured_powerbi,
                  start=1
              ):

                  hugo_lines.extend([
                      f"### {index:02d} "
                      f"{featured['title']}",
                      "",
                      f"**{featured['type']}**",
                      "",
                      featured["description"],
                      "",
                      f"[Voir le projet]"
                      f"({github_url(featured['path'])})",
                      "",
                  ])

          if not featured_existing:

              hugo_lines.extend([
                  "_Aucun projet vitrine disponible pour le moment._",
                  "",
              ])

          # ================================================================
          # ECRITURE HUGO
          # ================================================================

          HUGO_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          HUGO_PATH.write_text(
              "\n".join(hugo_lines).rstrip() + "\n",
              encoding="utf-8",
              newline="\n"
          )

          print()
          print("=" * 70)
          print("GENERATION TERMINEE")
          print("=" * 70)

          print(
              f"Machine Learning : {len(ml_projects)} projet(s)"
          )

          print(
              f"Power BI : {len(powerbi_projects)} projet(s)"
          )

          print(
              f"Excel : {len(excel_projects)} projet(s)"
          )

          print(
              f"Python : {len(python_projects)} projet(s)"
          )

          print(
              f"SQL : {len(sql_projects)} projet(s)"
          )

          print(
              f"Projets Hugo : {len(featured_existing)} projet(s)"
          )

          print()
          print(
              "README.md et content/projets/_index.md "
              "ont été générés."
          )
          PY

      - name: Afficher les fichiers générés
        shell: bash
        run: |
          echo "=============================================="
          echo "README.md"
          echo "=============================================="
          git diff -- README.md || true

          echo
          echo "=============================================="
          echo "HUGO"
          echo "=============================================="
          git diff -- content/projets/_index.md || true

      - name: Commit des fichiers générés
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification générée."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"

          git pull --rebase origin main

          git push origin main
