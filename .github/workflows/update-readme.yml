name: Update Portfolio README

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README and Hugo projects page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          REPO = "https://github.com/fbomisso/fabrice.bomisso"

          # ============================================================
          # CONFIGURATION
          # ============================================================

          IGNORED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "data",
              "Data",
              "documentation",
              "Documentation",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "_template",
          }

          ML_PROJECTS = {
              "01_Prediction_progression_diabete",
              "02_Prediction_bruit_aerodynamique",
              "01_Customer_Churn",
          }

          POWERBI_ROOT = Path("PowerBI")
          ML_ROOT = Path("Machine-Learning")

          # ============================================================
          # HELPERS
          # ============================================================

          def display_name(name):
              return name.replace("-", " ").replace("_", " ")


          def github_link(path):
              return f"{REPO}/tree/main/{path.as_posix()}"


          def is_valid_project(path):
              return (
                  path.is_dir()
                  and path.name not in IGNORED_DIRS
                  and not path.name.startswith(".")
                  and (path / "README.md").is_file()
              )


          def find_ml_projects(root):
              if not root.is_dir():
                  return []

              projects = []

              for path in root.rglob("*"):
                  if not is_valid_project(path):
                      continue

                  # Seuls les dossiers correspondant aux vrais projets
                  # ML sont retenus.
                  if path.name in ML_PROJECTS:
                      projects.append(path)

              return sorted(
                  projects,
                  key=lambda path: path.as_posix().lower()
              )


          def find_powerbi_projects(root):
              if not root.is_dir():
                  return []

              projects = []

              for path in root.iterdir():
                  if is_valid_project(path):
                      projects.append(path)

              return sorted(
                  projects,
                  key=lambda path: path.name.lower()
              )


          # ============================================================
          # DISCOVERY
          # ============================================================

          ml_projects = find_ml_projects(ML_ROOT)
          powerbi_projects = find_powerbi_projects(POWERBI_ROOT)

          print("Projets Machine Learning détectés :")
          for project in ml_projects:
              print(f"  - {project}")

          print()

          print("Projets Power BI détectés :")
          for project in powerbi_projects:
              print(f"  - {project}")

          print()

          if len(ml_projects) != 3:
              raise RuntimeError(
                  f"Nombre inattendu de projets Machine Learning : "
                  f"{len(ml_projects)} au lieu de 3."
              )

          if len(powerbi_projects) != 9:
              raise RuntimeError(
                  f"Nombre inattendu de projets Power BI : "
                  f"{len(powerbi_projects)} au lieu de 9."
              )

          # ============================================================
          # MAIN README
          # ============================================================

          readme = Path("README.md")

          start = "<!-- AUTO_STRUCTURE_START -->"
          end = "<!-- AUTO_STRUCTURE_END -->"

          content = readme.read_text(encoding="utf-8")

          if start not in content:
              raise ValueError(
                  "AUTO_STRUCTURE_START est absent du README."
              )

          if end not in content:
              raise ValueError(
                  "AUTO_STRUCTURE_END est absent du README."
              )

          section_start = content.index(start)
          section_end = content.index(end) + len(end)

          lines = [
              start,
              "",
          ]

          # ------------------------------------------------------------
          # MACHINE LEARNING
          # ------------------------------------------------------------

          lines.extend([
              "### 🤖 Machine Learning",
              "",
          ])

          for project in ml_projects:
              lines.append(
                  f"- [{display_name(project.name)}]"
                  f"({github_link(project)})"
              )

          lines.append("")

          # ------------------------------------------------------------
          # POWER BI
          # ------------------------------------------------------------

          lines.extend([
              "### 📊 Power BI",
              "",
          ])

          for project in powerbi_projects:
              lines.append(
                  f"- [{display_name(project.name)}]"
                  f"({github_link(project)})"
              )

          lines.extend([
              "",
              end,
          ])

          generated = "\n".join(lines)

          readme.write_text(
              content[:section_start]
              + generated
              + content[section_end:],
              encoding="utf-8",
              newline="\n",
          )

          # ============================================================
          # HUGO PROJECTS PAGE
          # ============================================================

          projects_page = Path("content/projets/_index.md")

          hugo_lines = [
              "---",
              'title: "Projets"',
              "---",
              "",
              "Une sélection de projets réalisés en Business Intelligence, Data Analytics et Data Science.",
              "",
          ]

          # ------------------------------------------------------------
          # MACHINE LEARNING
          # ------------------------------------------------------------

          hugo_lines.extend([
              "## 🤖 Machine Learning",
              "",
          ])

          ml_descriptions = {
              "01_Prediction_progression_diabete":
                  "Projet de régression visant à prédire la progression du diabète à partir de variables cliniques.",

              "02_Prediction_bruit_aerodynamique":
                  "Projet de régression consacré à la prédiction du bruit aérodynamique.",

              "01_Customer_Churn":
                  "Prédiction du churn client avec Random Forest, analyse SHAP, segmentation des risques et application Streamlit.",
          }

          for project in ml_projects:
              description = ml_descriptions.get(
                  project.name,
                  "Projet de Machine Learning présenté dans le portfolio.",
              )

              hugo_lines.extend([
                  f"### {display_name(project.name)}",
                  "",
                  "**Machine Learning**",
                  "",
                  description,
                  "",
                  f"[Voir le projet]({github_link(project)})",
                  "",
              ])

          # ------------------------------------------------------------
          # POWER BI
          # ------------------------------------------------------------

          hugo_lines.extend([
              "## 📊 Power BI",
              "",
          ])

          powerbi_descriptions = {
              "analyse-coupe-du-monde-fifa-2026":
                  "Analyse et visualisation de la Coupe du Monde FIFA 2026 avec Power BI.",

              "analyse-performance-football-europe":
                  "Analyse de la performance du football européen avec Power BI.",

              "analyse-performance-olist":
                  "Analyse de performance e-commerce avec Power BI.",

              "analyse-pitchside-pro-revenue":
                  "Analyse des revenus et de la performance commerciale avec Power BI.",

              "analyse-retail-star-schema":
                  "Analyse retail avec modèle en étoile, audit DAX et validation des indicateurs.",

              "assurance-automobile-dashboard":
                  "Analyse et pilotage de la performance d'un portefeuille automobile.",

              "gap-service":
                  "Analyse et pilotage de la performance du service.",

              "pilotage-reseau-distribution-multimagasin":
                  "Pilotage décisionnel d'un réseau de distribution multi-magasins avec Power BI.",

              "pilotage-reseau-distribution-multimagasin":
                  "Pilotage décisionnel d'un réseau de distribution multi-magasins avec Power BI.",

              "pilotage-risque-credit-bancaire":
                  "Analyse et pilotage du risque de crédit bancaire.",
          }

          for project in powerbi_projects:
              description = powerbi_descriptions.get(
                  project.name,
                  "Projet de Business Intelligence réalisé avec Power BI.",
              )

              hugo_lines.extend([
                  f"### {display_name(project.name)}",
                  "",
                  "**Power BI · Business Intelligence**",
                  "",
                  description,
                  "",
                  f"[Voir le projet]({github_link(project)})",
                  "",
              ])

          # ------------------------------------------------------------
          # ALL PROJECTS
          # ------------------------------------------------------------

          hugo_lines.extend([
              "## Tous mes projets",
              "",
              f"[Voir mes projets Power BI]({github_link(POWERBI_ROOT)})",
              "",
              f"[Voir mes projets Machine Learning]({github_link(ML_ROOT)})",
              "",
          ])

          sql_root = Path("sql")

          if sql_root.exists():
              hugo_lines.extend([
                  f"[Voir mes projets SQL]({github_link(sql_root)})",
                  "",
              ])

          projects_page.write_text(
              "\n".join(hugo_lines),
              encoding="utf-8",
              newline="\n",
          )

          # ============================================================
          # SUMMARY
          # ============================================================

          print(
              f"Machine Learning : {len(ml_projects)} projet(s)"
          )

          print(
              f"Power BI : {len(powerbi_projects)} projet(s)"
          )

          print(
              "README.md et content/projets/_index.md générés avec succès."
          )
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "chore: update portfolio project listings"
            git push
          fi