name: Update Portfolio Projects

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - "PowerBI/**"
      - "Excel/**"
      - "Python/**"
      - "sql/**"
      - "README.md"
      - "content/projets/_index.md"
      - ".github/workflows/update-readme.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-projects
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate README and Hugo projects page
        shell: bash
        run: |
          python <<'PY'

          from pathlib import Path
          import re

          REPO_URL = "https://github.com/fbomisso/fabrice.bomisso"

          README_PATH = Path("README.md")
          HUGO_PROJECTS_PATH = Path("content/projets/_index.md")

          IGNORED_DIRS = {
              ".git",
              ".github",
              ".gitmodules",
              "__pycache__",
              "node_modules",
              "venv",
              ".venv",
              "env",
              ".env",
              "data",
              "Data",
              "raw",
              "documentation",
              "Documentation",
              "docs",
              "Docs",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "model",
              "app",
              "Visuels_Projet",
              "_template",
          }

          CUSTOM_DESCRIPTIONS = {
              "Machine-Learning/"
              "I_Apprentissage_supervise/"
              "A_Regression/"
              "01_Prediction_progression_diabete":
                  "Projet de régression visant à prédire la progression "
                  "du diabète à partir de variables cliniques.",

              "Machine-Learning/"
              "I_Apprentissage_supervise/"
              "A_Regression/"
              "02_Prediction_bruit_aerodynamique":
                  "Projet de régression consacré à la prédiction "
                  "du bruit aérodynamique.",

              "Machine-Learning/"
              "I_Apprentissage_supervise/"
              "B_Classification/"
              "01_Customer_Churn":
                  "Prédiction du churn client avec Random Forest, "
                  "analyse SHAP, segmentation des risques "
                  "et application Streamlit.",

              "PowerBI/analyse-coupe-du-monde-fifa-2026":
                  "Analyse et visualisation de la Coupe du Monde "
                  "FIFA 2026 avec Power BI.",

              "PowerBI/analyse-performance-football-europe":
                  "Analyse de la performance du football européen "
                  "avec Power BI.",

              "PowerBI/analyse-performance-olist":
                  "Analyse de la performance e-commerce "
                  "avec Power BI.",

              "PowerBI/analyse-pitchside-pro-revenue":
                  "Analyse des revenus et de la performance "
                  "commerciale avec Power BI.",

              "PowerBI/analyse-retail-star-schema":
                  "Analyse retail avec modèle en étoile, "
                  "audit DAX et validation des indicateurs.",

              "PowerBI/assurance-automobile-dashboard":
                  "Analyse et pilotage de la performance "
                  "d'un portefeuille automobile.",

              "PowerBI/gap-service":
                  "Analyse et pilotage de la performance du service.",

              "PowerBI/pilotage-reseau-distribution-multimagasins":
                  "Pilotage décisionnel d'un réseau de distribution "
                  "multi-magasins avec Power BI.",

              "PowerBI/pilotage-risque-credit-bancaire":
                  "Analyse et pilotage du risque de crédit bancaire.",
          }

          def is_hidden(path: Path) -> bool:
              return any(
                  part.startswith(".")
                  for part in path.parts
              )

          def is_ignored(path: Path) -> bool:
              return any(
                  part in IGNORED_DIRS
                  for part in path.parts
              )

          def has_readme(path: Path) -> bool:
              return (
                  path.is_dir()
                  and (path / "README.md").is_file()
              )

          def clean_name(name: str) -> str:
              name = name.replace("_", " ")
              name = name.replace("-", " ")
              name = re.sub(r"\s+", " ", name).strip()
              return name

          def remove_existing_number(name: str) -> str:
              return re.sub(
                  r"^\d+[\s._-]*",
                  "",
                  name
              ).strip()

          def display_name(name: str) -> str:
              name = remove_existing_number(name)
              return clean_name(name)

          def github_url(path: Path) -> str:
              relative = path.as_posix().strip("/")
              return f"{REPO_URL}/tree/main/{relative}"

          def project_key(path: Path) -> str:
              return path.as_posix().strip("/")

          def get_description(path: Path, category: str) -> str:
              key = project_key(path)

              if key in CUSTOM_DESCRIPTIONS:
                  return CUSTOM_DESCRIPTIONS[key]

              if category == "Machine Learning":
                  return (
                      "Projet de Machine Learning consacré "
                      "à l'analyse, la modélisation et la "
                      "prédiction à partir de données."
                  )

              if category == "Power BI":
                  return (
                      "Projet de Business Intelligence consacré "
                      "à l'analyse et à la visualisation "
                      "des données avec Power BI."
                  )

              if category == "Excel":
                  return (
                      "Projet d'analyse et de traitement "
                      "de données réalisé avec Excel."
                  )

              if category == "Python":
                  return (
                      "Projet d'analyse, de traitement "
                      "ou de modélisation de données avec Python."
                  )

              if category == "SQL":
                  return (
                      "Projet d'analyse et de traitement "
                      "de données avec SQL."
                  )

              return "Projet présenté dans le portfolio."

          def is_project(path: Path) -> bool:
              if not path.is_dir():
                  return False

              if is_hidden(path):
                  return False

              if is_ignored(path):
                  return False

              return has_readme(path)

          def natural_sort_key(path: Path):
              parts = []

              for part in path.parts:
                  chunks = re.split(
                      r"(\d+)",
                      part.lower()
                  )

                  for chunk in chunks:
                      if chunk.isdigit():
                          parts.append(
                              (0, int(chunk))
                          )
                      else:
                          parts.append(
                              (1, chunk)
                          )

              return parts

          # ============================================================
          # MACHINE LEARNING
          # ============================================================

          ml_root = Path("Machine-Learning")
          ml_structure = []

          if ml_root.is_dir():

              learning_families = sorted(
                  [
                      p
                      for p in ml_root.iterdir()
                      if (
                          p.is_dir()
                          and not is_hidden(p)
                          and not is_ignored(p)
                      )
                  ],
                  key=natural_sort_key
              )

              for family in learning_families:

                  family_entry = {
                      "path": family,
                      "categories": [],
                      "projects": []
                  }

                  children = sorted(
                      [
                          p
                          for p in family.iterdir()
                          if (
                              p.is_dir()
                              and not is_hidden(p)
                              and not is_ignored(p)
                          )
                      ],
                      key=natural_sort_key
                  )

                  for child in children:

                      projects = sorted(
                          [
                              p
                              for p in child.iterdir()
                              if is_project(p)
                          ],
                          key=natural_sort_key
                      )

                      if projects:

                          family_entry["categories"].append(
                              {
                                  "path": child,
                                  "projects": projects
                              }
                          )

                      elif has_readme(child):

                          family_entry["categories"].append(
                              {
                                  "path": child,
                                  "projects": []
                              }
                          )

                  direct_projects = sorted(
                      [
                          p
                          for p in children
                          if is_project(p)
                      ],
                      key=natural_sort_key
                  )

                  if direct_projects:
                      family_entry["projects"] = direct_projects

                  if (
                      has_readme(family)
                      or family_entry["categories"]
                      or family_entry["projects"]
                  ):
                      ml_structure.append(
                          family_entry
                      )

          # ============================================================
          # CATEGORIES DIRECTES
          # ============================================================

          def detect_direct_projects(root_name):

              root = Path(root_name)
              projects = []

              if root.is_dir():

                  for path in root.iterdir():

                      if is_project(path):
                          projects.append(path)

              return sorted(
                  projects,
                  key=natural_sort_key
              )

          powerbi_projects = detect_direct_projects("PowerBI")
          excel_projects = detect_direct_projects("Excel")
          python_projects = detect_direct_projects("Python")
          sql_projects = detect_direct_projects("sql")

          # ============================================================
          # LOGS
          # ============================================================

          print()
          print("=" * 70)
          print("PROJETS DETECTES")
          print("=" * 70)

          print()
          print("MACHINE LEARNING")

          for family in ml_structure:

              print(
                  f"  {family['path'].as_posix()}"
              )

              for category in family["categories"]:

                  print(
                      f"    {category['path'].as_posix()}"
                  )

                  for project in category["projects"]:

                      print(
                          f"      - {project.as_posix()}"
                      )

              for project in family["projects"]:

                  print(
                      f"    - {project.as_posix()}"
                  )

          print()
          print(
              f"POWER BI : {len(powerbi_projects)} projet(s)"
          )

          for project in powerbi_projects:
              print(f"  - {project.as_posix()}")

          print()
          print(
              f"EXCEL : {len(excel_projects)} projet(s)"
          )

          for project in excel_projects:
              print(f"  - {project.as_posix()}")

          print()
          print(
              f"PYTHON : {len(python_projects)} projet(s)"
          )

          for project in python_projects:
              print(f"  - {project.as_posix()}")

          print()
          print(
              f"SQL : {len(sql_projects)} projet(s)"
          )

          for project in sql_projects:
              print(f"  - {project.as_posix()}")

          # ============================================================
          # README
          # ============================================================

          README_START = "<!-- AUTO_STRUCTURE_START -->"
          README_END = "<!-- AUTO_STRUCTURE_END -->"

          readme_content = README_PATH.read_text(
              encoding="utf-8"
          )

          if README_START not in readme_content:
              raise ValueError(
                  "Le marqueur AUTO_STRUCTURE_START "
                  "est absent de README.md."
              )

          if README_END not in readme_content:
              raise ValueError(
                  "Le marqueur AUTO_STRUCTURE_END "
                  "est absent de README.md."
              )

          readme_lines = [
              README_START,
              "",
              "### 🤖 Machine Learning",
              ""
          ]

          ml_project_counter = 1

          for family in ml_structure:

              family_name = display_name(
                  family["path"].name
              )

              family_url = github_url(
                  family["path"]
              )

              readme_lines.extend([
                  f"#### [{family_name}]({family_url})",
                  ""
              ])

              for category in family["categories"]:

                  category_name = display_name(
                      category["path"].name
                  )

                  category_url = github_url(
                      category["path"]
                  )

                  readme_lines.extend([
                      f"**[{category_name}]({category_url})**",
                      ""
                  ])

                  for project in category["projects"]:

                      project_name = display_name(
                          project.name
                      )

                      project_url = github_url(
                          project
                      )

                      readme_lines.append(
                          f"- [{ml_project_counter:02d} "
                          f"{project_name}]"
                          f"({project_url})"
                      )

                      ml_project_counter += 1

                  readme_lines.append("")

              for project in family["projects"]:

                  project_name = display_name(
                      project.name
                  )

                  project_url = github_url(
                      project
                  )

                  readme_lines.append(
                      f"- [{ml_project_counter:02d} "
                      f"{project_name}]"
                      f"({project_url})"
                  )

                  ml_project_counter += 1

              readme_lines.append("")

          def add_direct_category(
              lines,
              title,
              projects
          ):

              if not projects:
                  return

              lines.extend([
                  title,
                  ""
              ])

              for index, project in enumerate(
                  projects,
                  start=1
              ):

                  project_name = display_name(
                      project.name
                  )

                  project_url = github_url(
                      project
                  )

                  lines.append(
                      f"- [{index:02d} "
                      f"{project_name}]"
                      f"({project_url})"
                  )

              lines.append("")

          add_direct_category(
              readme_lines,
              "### 📊 Power BI",
              powerbi_projects
          )

          add_direct_category(
              readme_lines,
              "### 📗 Excel",
              excel_projects
          )

          add_direct_category(
              readme_lines,
              "### 🐍 Python",
              python_projects
          )

          add_direct_category(
              readme_lines,
              "### 🗄️ SQL",
              sql_projects
          )

          readme_lines.append(README_END)

          generated_readme_section = "\n".join(
              readme_lines
          )

          start_index = readme_content.index(
              README_START
          )

          end_index = (
              readme_content.index(README_END)
              + len(README_END)
          )

          new_readme_content = (
              readme_content[:start_index]
              + generated_readme_section
              + readme_content[end_index:]
          )

          README_PATH.write_text(
              new_readme_content,
              encoding="utf-8",
              newline="\n"
          )

          # ============================================================
          # HUGO
          # ============================================================

          hugo_lines = [
              "---",
              'title: "Projets"',
              "---",
              "",
              "Une sélection de projets réalisés en "
              "Business Intelligence, Data Analytics "
              "et Data Science.",
              "",
              "## 🤖 Machine Learning",
              ""
          ]

          for family in ml_structure:

              family_name = display_name(
                  family["path"].name
              )

              family_url = github_url(
                  family["path"]
              )

              hugo_lines.extend([
                  f"### [{family_name}]({family_url})",
                  ""
              ])

              for category in family["categories"]:

                  category_name = display_name(
                      category["path"].name
                  )

                  category_url = github_url(
                      category["path"]
                  )

                  hugo_lines.extend([
                      f"#### [{category_name}]"
                      f"({category_url})",
                      ""
                  ])

                  for project in category["projects"]:

                      project_name = display_name(
                          project.name
                      )

                      project_url = github_url(
                          project
                      )

                      description = get_description(
                          project,
                          "Machine Learning"
                      )

                      hugo_lines.extend([
                          f"**{project_name}**",
                          "",
                          description,
                          "",
                          f"[Voir le projet]({project_url})",
                          ""
                      ])

              for project in family["projects"]:

                  project_name = display_name(
                      project.name
                  )

                  project_url = github_url(
                      project
                  )

                  description = get_description(
                      project,
                      "Machine Learning"
                  )

                  hugo_lines.extend([
                      f"**{project_name}**",
                      "",
                      description,
                      "",
                      f"[Voir le projet]({project_url})",
                      ""
                  ])

          def add_hugo_category(
              lines,
              title,
              category,
              projects
          ):

              if not projects:
                  return

              lines.extend([
                  title,
                  ""
              ])

              for index, project in enumerate(
                  projects,
                  start=1
              ):

                  project_name = display_name(
                      project.name
                  )

                  project_url = github_url(
                      project
                  )

                  description = get_description(
                      project,
                      category
                  )

                  lines.extend([
                      f"### {index:02d} "
                      f"{project_name}",
                      "",
                      f"**{category}**",
                      "",
                      description,
                      "",
                      f"[Voir le projet]({project_url})",
                      ""
                  ])

          add_hugo_category(
              hugo_lines,
              "## 📊 Power BI",
              "Power BI",
              powerbi_projects
          )

          add_hugo_category(
              hugo_lines,
              "## 📗 Excel",
              "Excel",
              excel_projects
          )

          add_hugo_category(
              hugo_lines,
              "## 🐍 Python",
              "Python",
              python_projects
          )

          add_hugo_category(
              hugo_lines,
              "## 🗄️ SQL",
              "SQL",
              sql_projects
          )

          hugo_lines.extend([
              "## Tous mes projets",
              ""
          ])

          main_categories = [
              ("Machine Learning", "Machine-Learning"),
              ("Power BI", "PowerBI"),
              ("Excel", "Excel"),
              ("Python", "Python"),
              ("SQL", "sql")
          ]

          for label, path in main_categories:

              root = Path(path)

              if root.is_dir():

                  hugo_lines.append(
                      f"- [Voir mes projets {label}]"
                      f"({REPO_URL}/tree/main/{path})"
                  )

          hugo_lines.append("")

          HUGO_PROJECTS_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          HUGO_PROJECTS_PATH.write_text(
              "\n".join(hugo_lines).rstrip() + "\n",
              encoding="utf-8",
              newline="\n"
          )

          ml_total = 0

          for family in ml_structure:

              for category in family["categories"]:
                  ml_total += len(category["projects"])

              ml_total += len(family["projects"])

          print()
          print("=" * 70)
          print("GENERATION TERMINEE")
          print("=" * 70)
          print(
              f"Machine Learning : {ml_total} projet(s)"
          )
          print(
              f"Power BI         : {len(powerbi_projects)} projet(s)"
          )
          print(
              f"Excel            : {len(excel_projects)} projet(s)"
          )
          print(
              f"Python           : {len(python_projects)} projet(s)"
          )
          print(
              f"SQL              : {len(sql_projects)} projet(s)"
          )
          print("=" * 70)

          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md content/projets/_index.md

          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
            exit 0
          fi

          git commit -m "chore: update portfolio projects"
          git push origin main
