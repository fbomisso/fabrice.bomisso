name: Update Machine Learning README

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - ".github/workflows/update-machine-learning-readme.yml"

permissions:
  contents: write

concurrency:
  group: machine-learning-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Machine Learning README
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("Machine-Learning")
          readme = root / "README.md"

          ignored = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "data",
              "Visuels_Projet"
          }

          category_descriptions = {
              "Classification": "Projets de classification supervisée",
              "Regression": "Projets de régression et de prédiction",
              "Deep-Learning": "Projets de Deep Learning et réseaux de neurones",
              "Clustering": "Projets d'apprentissage non supervisé et clustering",
              "Reinforcement-Learning": "Projets d'apprentissage par renforcement"
          }

          def display_name(name):
              return name.replace("-", " ").replace("_", " ")

          def github_link(path):
              relative = path.as_posix()
              return (
                  "https://github.com/fbomisso/fabrice.bomisso/"
                  f"tree/main/{relative}"
              )

          lines = []

          categories = sorted(
              folder
              for folder in root.iterdir()
              if folder.is_dir()
              and folder.name not in ignored
              and not folder.name.startswith(".")
          )

          if not categories:
              lines.append("_Aucun projet disponible pour le moment._")
          else:

              for category in categories:

                  category_name = display_name(category.name)

                  description = category_descriptions.get(
                      category.name,
                      "Projets Machine Learning"
                  )

                  lines.append(
                      f"### 📁 {category_name}"
                  )
                  lines.append("")
                  lines.append(description)
                  lines.append("")

                  projects = sorted(
                      folder
                      for folder in category.iterdir()
                      if folder.is_dir()
                      and folder.name not in ignored
                      and not folder.name.startswith(".")
                  )

                  if not projects:
                      lines.append(
                          "_Aucun projet dans cette catégorie._"
                      )
                      lines.append("")
                      continue

                  for project in projects:

                      project_name = display_name(project.name)

                      project_url = github_link(project)

                      lines.append(
                          f"- **[{project_name}]({project_url})**"
                      )

                      nested_dirs = sorted(
                          folder
                          for folder in project.rglob("*")
                          if folder.is_dir()
                          and folder.name not in ignored
                          and not folder.name.startswith(".")
                      )

                      for nested in nested_dirs:

                          relative = nested.relative_to(project)

                          nested_url = github_link(nested)

                          lines.append(
                              f"  - [`{relative}/`]({nested_url})"
                          )

                  lines.append("")

          start = "<!-- AUTO_PROJECTS_START -->"
          end = "<!-- AUTO_PROJECTS_END -->"

          content = readme.read_text(
              encoding="utf-8"
          )

          if start not in content:
              raise ValueError(
                  "AUTO_PROJECTS_START est absent du README."
              )

          if end not in content:
              raise ValueError(
                  "AUTO_PROJECTS_END est absent du README."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          generated = (
              start
              + "\n\n"
              + "\n".join(lines)
              + "\n"
              + end
          )

          content = (
              content[:start_index]
              + generated
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8"
          )

          print(
              "README Machine Learning mis à jour avec succès."
          )
          PY

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Machine-Learning/README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README Machine Learning."
          else
            git commit -m "chore: update Machine Learning README"
            git push
          fi