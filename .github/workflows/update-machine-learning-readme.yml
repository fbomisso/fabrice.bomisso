name: Update Machine Learning README

on:
  push:
    branches:
      - main
    paths:
      - "Machine-Learning/**"
      - ".github/workflows/update-machine-learning-readme.yml"

permissions:
  contents: write

concurrency:
  group: machine-learning-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Machine Learning README
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("Machine-Learning")
          readme = root / "README.md"

          ignored_dirs = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "data",
              "Data",
              "documentation",
              "Documentation",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "_template",
          }

          def display_name(name):
              return name.replace("-", " ").replace("_", " ")

          def github_link(path):
              relative = path.as_posix()
              return (
                  "https://github.com/fbomisso/fabrice.bomisso/"
                  f"tree/main/{relative}"
              )

          def is_project(path):
              return (
                  path.is_dir()
                  and path.name not in ignored_dirs
                  and not path.name.startswith(".")
                  and (path / "README.md").is_file()
              )

          lines = [
              "<!-- AUTO_PROJECTS_START -->",
              "",
          ]

          # ============================================================
          # I. APPRENTISSAGE SUPERVISÉ
          # ============================================================

          supervised = root / "I_Apprentissage_supervise"

          if supervised.is_dir():

              lines.extend([
                  "## 📚 I. Apprentissage supervisé",
                  "",
              ])

              # --------------------------------------------------------
              # A. RÉGRESSION
              # --------------------------------------------------------

              regression = supervised / "A_Regression"

              if regression.is_dir():

                  lines.extend([
                      "### 📈 A. Régression",
                      "",
                  ])

                  projects = sorted(
                      (
                          p for p in regression.iterdir()
                          if is_project(p)
                      ),
                      key=lambda p: p.name.lower()
                  )

                  for project in projects:
                      name = display_name(project.name)
                      url = github_link(project)
                      lines.append(f"- **[{name}]({url})**")

                  lines.append("")

              # --------------------------------------------------------
              # B. CLASSIFICATION
              # --------------------------------------------------------

              classification = supervised / "B_Classification"

              if classification.is_dir():

                  lines.extend([
                      "### 🏷️ B. Classification",
                      "",
                  ])

                  projects = sorted(
                      (
                          p for p in classification.iterdir()
                          if is_project(p)
                      ),
                      key=lambda p: p.name.lower()
                  )

                  for project in projects:
                      name = display_name(project.name)
                      url = github_link(project)
                      lines.append(f"- **[{name}]({url})**")

                  lines.append("")

          # ============================================================
          # II. APPRENTISSAGE NON SUPERVISÉ
          # ============================================================

          unsupervised = root / "II_Apprentissage_non_supervise"

          if unsupervised.is_dir():

              lines.extend([
                  "## 📚 II. Apprentissage non supervisé",
                  "",
              ])

              categories = sorted(
                  (
                      p for p in unsupervised.iterdir()
                      if (
                          p.is_dir()
                          and p.name not in ignored_dirs
                          and not p.name.startswith(".")
                      )
                  ),
                  key=lambda p: p.name.lower()
              )

              for category in categories:

                  lines.extend([
                      f"### 📁 {display_name(category.name)}",
                      "",
                  ])

                  projects = sorted(
                      (
                          p for p in category.iterdir()
                          if is_project(p)
                      ),
                      key=lambda p: p.name.lower()
                  )

                  for project in projects:
                      name = display_name(project.name)
                      url = github_link(project)
                      lines.append(f"- **[{name}]({url})**")

                  lines.append("")

          # ============================================================
          # UPDATE README
          # ============================================================

          lines.append("<!-- AUTO_PROJECTS_END -->")

          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO_PROJECTS_START -->"
          end = "<!-- AUTO_PROJECTS_END -->"

          if start not in content:
              raise ValueError(
                  "AUTO_PROJECTS_START est absent du README."
              )

          if end not in content:
              raise ValueError(
                  "AUTO_PROJECTS_END est absent du README."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          generated = "\n".join(lines)

          content = (
              content[:start_index]
              + generated
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8",
              newline="\n"
          )

          print(
              "README Machine Learning mis à jour avec succès."
          )
          PY

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Machine-Learning/README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README Machine Learning."
          else
            git commit -m "chore: update Machine Learning README"
            git push
          fi