name: Update Power BI README

on:
  push:
    branches:
      - main
    paths:
      - "PowerBI/**"
      - ".github/workflows/update-powerbi-readme.yml"

permissions:
  contents: write

concurrency:
  group: powerbi-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Power BI README
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("PowerBI")
          readme = root / "README.md"

          ignored_dirs = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              "data",
              "Data",
              "documentation",
              "Documentation",
              "screenshots",
              "Screenshots",
              "notebooks",
              "models",
              "app",
              "Visuels_Projet",
              "_template",
          }

          def display_name(name):
              return name.replace("-", " ").replace("_", " ")

          def github_link(path):
              relative = path.as_posix()
              return (
                  "https://github.com/fbomisso/fabrice.bomisso/"
                  f"tree/main/{relative}"
              )

          def is_project(path):
              return (
                  path.is_dir()
                  and path.name not in ignored_dirs
                  and not path.name.startswith(".")
                  and (path / "README.md").is_file()
              )

          lines = [
              "<!-- AUTO_PROJECTS_START -->",
              "",
          ]

          projects = sorted(
              (
                  p for p in root.iterdir()
                  if is_project(p)
              ),
              key=lambda p: p.name.lower()
          )

          if not projects:

              lines.extend([
                  "_Aucun projet disponible pour le moment._",
                  "",
              ])

          else:

              for project in projects:

                  name = display_name(project.name)
                  url = github_link(project)

                  lines.extend([
                      f"## 📁 [{name}]({url})",
                      "",
                  ])

          lines.append("<!-- AUTO_PROJECTS_END -->")

          # ============================================================
          # UPDATE README
          # ============================================================

          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO_PROJECTS_START -->"
          end = "<!-- AUTO_PROJECTS_END -->"

          if start not in content:
              raise ValueError(
                  "AUTO_PROJECTS_START est absent du README."
              )

          if end not in content:
              raise ValueError(
                  "AUTO_PROJECTS_END est absent du README."
              )

          start_index = content.index(start)
          end_index = content.index(end) + len(end)

          generated = "\n".join(lines)

          content = (
              content[:start_index]
              + generated
              + content[end_index:]
          )

          readme.write_text(
              content,
              encoding="utf-8",
              newline="\n"
          )

          print(
              "README Power BI mis à jour avec succès."
          )
          PY

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PowerBI/README.md

          if git diff --cached --quiet; then
            echo "Aucune modification du README Power BI."
          else
            git commit -m "chore: update Power BI README"
            git push
          fi